mutation StartQuizSession($input: StartQuizSessionInput!) {
  startQuizSession(input: $input) {
    quizSession {
      id
      startedAt
      maxTimeInMinutes
      questions {
        id
        phrase
        answers {
          id
          phrase
        }
      }
    }
    errors {
      ... on QuizSessionNotFoundError {
        message
      }
      ... on QuizSessionExpiredError {
        message
      }
      ... on InvalidQuizSessionStatusError {
        message
      }
    }
  }
}
