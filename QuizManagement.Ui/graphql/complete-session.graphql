mutation CompleteQuizSession($input: CompleteQuizInput!) {
  completeQuiz(input: $input) {
    quizSession {
      id
      completedAt
      score
      percentage
      questions(includeNumber: true) {
        id
        number
        answers {
          id
          number
        }
      }
      wrongQuestionIds
      wrongAnswerIds
    }
  }
}
