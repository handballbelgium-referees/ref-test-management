<div class="bg-neutral-50 py-8 px-4">
  @if (loading()) {
  <div class="flex items-center justify-center min-h-[60vh]">
    <div class="text-center">
      <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-primary-600 mx-auto"></div>
      <p class="mt-4 text-neutral-600">{{ 'quiz.loading' | translate }}</p>
    </div>
  </div>
  } @else if (error()) {
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <app-quiz-error [errorType]="error()!" />
  </div>
  } @else if (quizCompleted()) {
  <app-quiz-results
    [questions]="questions()"
    [score]="score()!"
    [percentage]="percentage()!"
    [wrongQuestionIds]="wrongQuestionIds()"
    [wrongAnswerIds]="wrongAnswerIds()"
    [selectedAnswers]="selectedAnswers()"
    [currentLanguage]="currentLanguage()!"
  />
  } @else {
  <!-- Quiz Taking Screen -->
  <div class="max-w-4xl mx-auto">
    <app-quiz-header
      [timeRemaining]="formattedTimeRemaining()"
      [timeRemainingSeconds]="timeRemainingSeconds()"
      [answeredCount]="answeredCount()"
      [totalQuestions]="questions().length"
      [progress]="progress()"
    />

    @if (currentQuestion(); as question) {
    <app-question-card
      [question]="question"
      [currentIndex]="currentQuestionIndex()"
      [totalQuestions]="questions().length"
      [currentLanguage]="currentLanguage()!"
      [selectedAnswerIds]="selectedAnswers()[question.id]"
      (answerSelected)="selectAnswer(question.id, $event)"
    />
    }

    <app-quiz-navigation
      [questions]="questions()"
      [currentQuestionIndex]="currentQuestionIndex()"
      [answeredCount]="answeredCount()"
      [canPrevious]="canPrevious()"
      [canNext]="canNext()"
      [isLastQuestion]="isLastQuestion()"
      [isQuestionAnswered]="isQuestionAnswered.bind(this)"
      [isQuestionVisited]="isQuestionVisited.bind(this)"
      (previousClick)="previousQuestion()"
      (nextClick)="nextQuestion()"
      (submitClick)="requestSubmitQuiz()"
      (questionSelected)="goToQuestion($event)"
    />
  </div>
  }

  <!-- Submit Confirmation Dialog -->
  <app-submit-quiz-dialog
    [show]="showSubmitDialog()"
    [answeredCount]="answeredCount()"
    [totalQuestions]="questions().length"
    (confirm)="confirmSubmitQuiz()"
    (cancel)="cancelSubmit()"
  />

  <!-- Leave Confirmation Dialog -->
  <app-leave-quiz-dialog
    [show]="showLeaveDialog()"
    (confirm)="confirmLeave()"
    (cancel)="cancelLeave()"
  />
</div>
