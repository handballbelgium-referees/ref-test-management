<!-- Hero Section -->
@if(!error()) {
<app-quiz-hero />
}

<!-- Main Content -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  @if (loading()) {
  <div class="flex flex-col items-center justify-center py-20" role="status" aria-live="polite">
    <div
      class="h-12 w-12 animate-spin rounded-full border-4 border-primary-200 border-t-primary-600"
    ></div>
    <p class="mt-4 text-lg font-semibold text-neutral-700">
      {{ 'quiz.loading' | translate }}
    </p>
  </div>
  } @else if (error()) {
  <app-quiz-error [errorType]="error()!" />
  } @else if (session(); as session) {
  <div class="rounded-lg border border-neutral-200 bg-white p-6 shadow-sm">
    <!-- Session Details -->
    <app-session-details [session]="session" />

    <!-- Instructions -->
    <app-quiz-instructions [hasTimeLimit]="!!session.maxTimeInMinutes" />

    <!-- Start Button -->
    <button
      type="button"
      (click)="startQuiz()"
      [disabled]="!canStart()"
      class="w-full rounded-lg bg-primary-600 hover:bg-primary-700 px-6 py-4 text-lg font-semibold text-white transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ 'quiz.start_button' | translate }}
    </button>
  </div>
  }
</div>
