<div class="space-y-4">
  <!-- Status Filter Tabs -->
  <app-status-filter-tabs
    [selectedStatus]="filter().status"
    [statusCounts]="statusCounts()"
    (statusChange)="onStatusChange($event)"
  />

  <!-- Advanced Filters Panel -->
  <div class="bg-white rounded-xl shadow-sm border border-neutral-200 overflow-hidden">
    <button
      type="button"
      (click)="toggleFilters()"
      class="w-full px-4 py-3 flex items-center justify-between hover:bg-neutral-50 transition-colors"
    >
      <span class="text-sm font-medium text-neutral-900">
        {{ 'sessions.list.filters.advancedFilters' | translate }}
      </span>
      <svg
        class="w-5 h-5 text-neutral-500 transition-transform"
        [class.rotate-180]="filtersExpanded()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    @if (filtersExpanded()) {
    <div class="p-6 border-t border-neutral-200 bg-neutral-50">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Left Column: Title & Invitation Filters -->
        <div class="space-y-6">
          <!-- Title Filter -->
          <app-title-filter
            [selectedTitleId]="filter().titleId"
            (titleChange)="onTitleChange($event)"
          />

          <!-- Invitation Status -->
          <div class="bg-white rounded-lg p-4 border border-neutral-200">
            <div class="flex items-center gap-2 mb-3">
              <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <label class="text-sm font-semibold text-neutral-900">
                {{ 'sessions.list.filters.invitationLabel' | translate }}
              </label>
            </div>
            <select
              [value]="filter().invitationSent === undefined ? '' : filter().invitationSent"
              (change)="onInvitationChange($any($event.target).value)"
              class="w-full pl-3 pr-8 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm appearance-none"
            >
              <option value="">{{ 'sessions.list.filters.invitationAll' | translate }}</option>
              <option value="true">{{ 'sessions.list.filters.invitationSent' | translate }}</option>
              <option value="false">{{ 'sessions.list.filters.invitationNotSent' | translate }}</option>
            </select>
          </div>

          <!-- Results Filter -->
          <div class="bg-white rounded-lg p-4 border border-neutral-200">
            <div class="flex items-center gap-2 mb-3">
              <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <label class="text-sm font-semibold text-neutral-900">
                {{ 'sessions.list.filters.resultsLabel' | translate }}
              </label>
            </div>
            <select
              [value]="filter().resultsSent === undefined ? '' : filter().resultsSent"
              (change)="onResultsChange($any($event.target).value)"
              class="w-full pl-3 pr-8 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm appearance-none"
            >
              <option value="">{{ 'sessions.list.filters.resultsAll' | translate }}</option>
              <option value="true">{{ 'sessions.list.filters.resultsSent' | translate }}</option>
              <option value="false">{{ 'sessions.list.filters.resultsNotSent' | translate }}</option>
            </select>
          </div>

          <!-- Performance Filters -->
          <app-performance-filters
            [minScore]="filter().minScore"
            [maxScore]="filter().maxScore"
            [percentageRange]="filter().percentageRange"
            [minQuestions]="filter().minQuestions"
            [maxQuestions]="filter().maxQuestions"
            (performanceChange)="onPerformanceChange($event)"
          />
        </div>

        <!-- Right Column: Date Filters -->
        <div class="space-y-6">
          <!-- Started Date -->
          <app-date-range-filter
            label="sessions.list.filters.startedDateRange"
            [afterDate]="filter().startedAfter"
            [beforeDate]="filter().startedBefore"
            (dateChange)="onStartedDateChange($event)"
          />

          <!-- Completed Date -->
          <app-date-range-filter
            label="sessions.list.filters.completedDateRange"
            [afterDate]="filter().completedAfter"
            [beforeDate]="filter().completedBefore"
            (dateChange)="onCompletedDateChange($event)"
          />
        </div>
      </div>
    </div>
    }
  </div>

  <!-- Sorting Panel -->
  <app-sorting-panel
    [sortField]="filter().sortField"
    [sortDirection]="filter().sortDirection"
    (sortingChange)="onSortingChange($event)"
  />
</div>
