<div class="bg-white rounded-lg p-4 border border-neutral-200">
  <div class="flex items-center gap-2 mb-3">
    <svg
      class="w-5 h-5 text-primary-600"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
      />
    </svg>
    <h3 class="text-sm font-semibold text-neutral-900">
      {{ 'sessions.list.filters.performanceTitle' | translate }}
    </h3>
  </div>

  <div class="space-y-4">
    <!-- Question Score Range -->
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.questionScoreRange' | translate }}
      </label>
      <div class="flex flex-col sm:flex-row sm:items-center gap-2">
        <input
          type="number"
          [value]="minQuestionScore() || ''"
          (input)="onMinQuestionScoreChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.min' | translate"
          min="0"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
        <span class="text-neutral-400 hidden sm:inline">—</span>
        <input
          type="number"
          [value]="maxQuestionScore() || ''"
          (input)="onMaxQuestionScoreChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.max' | translate"
          min="0"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
      </div>
    </div>

    <!-- Answer Score Range -->
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.answerScoreRange' | translate }}
      </label>
      <div class="flex flex-col sm:flex-row sm:items-center gap-2">
        <input
          type="number"
          [value]="minAnswerScore() || ''"
          (input)="onMinAnswerScoreChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.min' | translate"
          min="0"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
        <span class="text-neutral-400 hidden sm:inline">—</span>
        <input
          type="number"
          [value]="maxAnswerScore() || ''"
          (input)="onMaxAnswerScoreChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.max' | translate"
          min="0"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
      </div>
    </div>

    <!-- Percentage Range -->
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.percentageRange' | translate }}
      </label>
      <select
        [value]="percentageRange() || ''"
        (change)="onPercentageRangeChange($any($event.target).value)"
        class="w-full pl-3 pr-8 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm appearance-none"
      >
        <option value="">{{ 'sessions.list.filters.percentageAll' | translate }}</option>
        <option value="low">{{ 'sessions.list.filters.percentageLow' | translate }}</option>
        <option value="medium">{{ 'sessions.list.filters.percentageMedium' | translate }}</option>
        <option value="high">{{ 'sessions.list.filters.percentageHigh' | translate }}</option>
      </select>
    </div>

    <!-- Questions Range -->
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.questionsRange' | translate }}
      </label>
      <div class="flex flex-col sm:flex-row sm:items-center gap-2">
        <input
          type="number"
          [value]="minQuestions() || ''"
          (input)="onMinQuestionsChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.min' | translate"
          min="1"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
        <span class="text-neutral-400 hidden sm:inline">—</span>
        <input
          type="number"
          [value]="maxQuestions() || ''"
          (input)="onMaxQuestionsChange($any($event.target).value)"
          [placeholder]="'sessions.list.filters.max' | translate"
          min="1"
          class="flex-1 px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
        />
      </div>
    </div>
  </div>
</div>
