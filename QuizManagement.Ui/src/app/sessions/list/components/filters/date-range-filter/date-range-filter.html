<div class="bg-white rounded-lg p-4 border border-neutral-200">
  <div class="flex items-center gap-2 mb-3">
    <svg
      class="w-5 h-5 text-primary-600"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <label class="text-sm font-semibold text-neutral-900">
      {{ label() | translate }}
    </label>
  </div>
  <div class="space-y-3">
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.from' | translate }}
      </label>
      <input
        type="date"
        [value]="afterDate() || ''"
        (input)="onAfterChange($any($event.target).value)"
        class="w-full px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
      />
    </div>
    <div>
      <label class="text-xs font-medium text-neutral-600 mb-1.5 block">
        {{ 'sessions.list.filters.to' | translate }}
      </label>
      <input
        type="date"
        [value]="beforeDate() || ''"
        (input)="onBeforeChange($any($event.target).value)"
        class="w-full px-3 py-2 bg-white border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm"
      />
    </div>
  </div>
</div>
