@if (show()) {
<div class="mb-4 p-4 bg-secondary-50 rounded-xl border border-secondary-200">
  <div class="mb-3">
    <label for="bulkQuestionText" class="block text-sm font-semibold text-neutral-900 mb-2">
      {{ 'sessions.create.form.specificQuestionNumbers.bulkImportLabel' | translate }}
    </label>
    <textarea
      id="bulkQuestionText"
      tabindex="2150"
      [value]="bulkText()"
      (input)="bulkText.set($any($event.target).value)"
      rows="6"
      [title]="'sessions.create.form.specificQuestionNumbers.bulkImportLabel' | translate"
      [attr.aria-label]="'sessions.create.form.specificQuestionNumbers.bulkImportLabel' | translate"
      class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 font-mono text-sm bg-white"
      placeholder="1, 5, 12&#10;20, 35&#10;101"
    ></textarea>
    <p class="mt-2 text-xs text-neutral-600">
      {{ 'sessions.create.form.specificQuestionNumbers.bulkImportHint' | translate }}
    </p>
  </div>
  <div class="flex gap-2">
    <button
      type="button"
      tabindex="2151"
      (click)="onImport()"
      class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 font-medium text-sm transition-colors"
    >
      {{ 'sessions.create.form.specificQuestionNumbers.bulkImportButton' | translate }}
    </button>
    <button
      type="button"
      tabindex="2152"
      (click)="onCancel()"
      class="px-4 py-2 bg-white border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 font-medium text-sm transition-colors"
    >
      {{ 'sessions.create.form.cancel' | translate }}
    </button>
  </div>
</div>
}
