name: Production Deployment

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Only stable tags (vX.Y.Z)

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  validate-tag:
    name: ✅ Validate Stable Tag
    runs-on: ubuntu-latest
    outputs:
      is-stable: ${{ steps.check-tag.outputs.is-stable }}
      version: ${{ steps.check-tag.outputs.version }}

    steps:
      - name: 🏷 Check tag format
        id: check-tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG_NAME"

          # Ensure tag matches vX.Y.Z format (no pre-release suffixes)
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "✅ Valid stable tag"
            echo "is-stable=true" >> $GITHUB_OUTPUT
            echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "❌ Not a stable tag (contains pre-release suffix)"
            echo "is-stable=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is-stable == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷 Set version
        run: |
          echo "APP_VERSION=${{ needs.validate-tag.outputs.version }}" >> $GITHUB_ENV
          echo "Building version ${{ needs.validate-tag.outputs.version }}"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🗂 Prepare wwwroot folder
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to .NET wwwroot
        run: |
          cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.sln

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.sln --configuration Release --no-restore

      - name: 📦 Publish .NET application
        run: |
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-production
          path: ./publish
          retention-days: 7

  deploy-production:
    name: 🚀 Deploy to Production (${{ needs.validate-tag.outputs.version }})
    runs-on: ubuntu-latest
    needs: [validate-tag, build]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-production
          path: ${{ github.workspace }}/publish

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (Production)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_PRODUCTION_NAME }}
          package: ${{ github.workspace }}/publish
          clean: true

      - name: 🎉 Deployment complete
        run: |
          echo "✅ Successfully deployed version ${{ needs.validate-tag.outputs.version }} to production"
          echo "🌐 URL: ${{ steps.deploy.outputs.webapp-url }}"
