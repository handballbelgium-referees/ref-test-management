name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

env:
    DOTNET_VERSION: 10.0.x
    NODE_VERSION: 22

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  validate:
    runs-on: ubuntu-latest
    needs: validate-pr-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./QuizManagement.Ui
        run: npm ci

      - name: Build Angular application
        working-directory: ./QuizManagement.Ui
        run: npm run build -- --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: Restore .NET dependencies
        run: dotnet restore handball-belgium-rules-quiz-management.sln

      - name: Build .NET application
        run: dotnet build handball-belgium-rules-quiz-management.sln --configuration Release --no-restore

  validate-deployment-config:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure Web App exists and is accessible
        run: |
          echo "=== Azure Configuration Diagnostics ==="
          echo ""
          
          # Show current subscription
          echo "Current Subscription:"
          az account show --query "{name:name, id:id, state:state}" -o table
          echo ""
          
          # List all resource groups to see permissions
          echo "Resource Groups (service principal has access to):"
          az group list --query "[].{name:name, location:location}" -o table
          echo ""
          
          echo "Validating Azure Web App: ${{ secrets.AZURE_WEBAPP_NAME }}"
          echo ""
          
          # Try to find the web app by directly querying with the name
          echo "Attempting direct access to web app..."
          if az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "name" -o tsv 2>/dev/null; then
            echo "✓ Web app '${{ secrets.AZURE_WEBAPP_NAME }}' exists and is accessible"
            echo ""
            
            # Get web app details
            echo "Web App Details:"
            az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "{name:name, resourceGroup:resourceGroup, state:state, defaultHostName:defaultHostName, kind:kind}" -o table
            echo ""
            
            echo "✓ Deployment configuration validated successfully!"
          else
            echo "✗ Cannot access web app '${{ secrets.AZURE_WEBAPP_NAME }}'"
            echo ""
            
            # Try to find it by listing all web apps
            echo "Searching for web app in accessible resources..."
            WEB_APPS=$(az webapp list --query "[].{name:name, resourceGroup:resourceGroup, state:state, location:location}" -o json 2>/dev/null || echo "[]")
            
            echo "Web apps visible to the service principal:"
            echo "$WEB_APPS" | jq -r '.[] | "\(.name) (RG: \(.resourceGroup))"' || echo "None found"
            echo ""
            
            echo "ISSUE IDENTIFIED:"
            echo "The service principal cannot see the web app '${{ secrets.AZURE_WEBAPP_NAME }}'."
            echo ""
            echo "To fix this, you need to grant the service principal access:"
            echo "1. Find the resource group containing 'referees-quiz-handballbelgium' in Azure Portal"
            echo "2. Go to that resource group → Access control (IAM)"
            echo "3. Click 'Add role assignment'"
            echo "4. Select role: 'Website Contributor' or 'Contributor'"
            echo "5. Assign access to the service principal used by this workflow"
            echo ""
            echo "Or run this Azure CLI command (replace <RESOURCE_GROUP> and <SERVICE_PRINCIPAL_ID>):"
            echo "az role assignment create --assignee <SERVICE_PRINCIPAL_ID> --role 'Website Contributor' --scope /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.Web/sites/${{ secrets.AZURE_WEBAPP_NAME }}"
            exit 1
          fi

      - name: Validate deployment settings
        run: |
          echo "Checking web app runtime settings..."
          az webapp config show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "{netFrameworkVersion:netFrameworkVersion, linuxFxVersion:linuxFxVersion, alwaysOn:alwaysOn}" -o table