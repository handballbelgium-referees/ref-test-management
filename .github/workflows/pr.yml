name: ✅ Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

# Least privilege by default. No pull-request check needs to write to the repository.
permissions:
  contents: read

jobs:
  validate-pr-title:
    name: 📝 Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: ✅ Validate PR title
        # The title must reach the shell as data, never as source. A ${{ }} expression is
        # substituted by the runner before the shell parses the line, so a title containing a
        # backtick or $(...) would execute on the runner — and this workflow triggers on
        # `edited`, so a title can be weaponised after review has started.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint
        # Ensures PR title follows Conventional Commits or your commitlint rules

  validate:
    name: 🛠 Build & Validate
    runs-on: ubuntu-latest
    needs: validate-pr-title

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production
        # Ensures that UI builds successfully in PR

      - name: 🌍 Check translation parity
        working-directory: ./RefTestManagement.Ui
        run: npm run check:i18n
        # A key present in one locale and missing from another renders as a raw key to that
        # participant. Nothing else catches it: a missing translation is not a build error.

      - name: 🧪 Run Angular unit tests
        working-directory: ./RefTestManagement.Ui
        run: npm test
        # The participant test-taking flow has no server-side safety net during the attempt

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx
        # Makes sure all NuGet packages are restored for .NET projects

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore
        # Validates .NET application can build successfully

      - name: 🧪 Run .NET unit tests
        run: dotnet test --solution RefTestManagement.slnx --configuration Release --no-build -p:TestingPlatformShowTestsFailure=true
        # Fails the check on a failing test. --solution is required by the MTP mode of dotnet test

  sync-readme-versions:
    name: 📄 Sync README Versions
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: 🔄 Run version sync script
        run: node scripts/sync-readme-versions.mjs
        # Covers bot-authored PRs (e.g. Renovate) that skip the local pre-commit hook

      - name: ❌ Fail if README needs changes
        run: |
          if ! git diff --quiet README.md; then
            echo "::error::README.md is out of sync. Run node scripts/sync-readme-versions.mjs and commit the result."
            git diff -- README.md
            exit 1
          else
            echo "README.md already up to date"
          fi
