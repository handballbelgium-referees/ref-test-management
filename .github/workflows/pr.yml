name: PR CI

on:
  pull_request:
    branches: [main]

env:
    DOTNET_VERSION: 10.0.x
    NODE_VERSION: 22

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  validate:
    runs-on: ubuntu-latest
    needs: validate-pr-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./QuizManagement.Ui
        run: npm ci

      - name: Build Angular application
        working-directory: ./QuizManagement.Ui
        run: npm run build -- --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: Restore .NET dependencies
        run: dotnet restore handball-belgium-rules-quiz-management.sln

      - name: Build .NET application
        run: dotnet build handball-belgium-rules-quiz-management.sln --configuration Release --no-restore