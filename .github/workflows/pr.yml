name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

env:
    DOTNET_VERSION: 10.0.x
    NODE_VERSION: 22

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  validate:
    runs-on: ubuntu-latest
    needs: validate-pr-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./QuizManagement.Ui
        run: npm ci

      - name: Build Angular application
        working-directory: ./QuizManagement.Ui
        run: npm run build -- --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: Restore .NET dependencies
        run: dotnet restore handball-belgium-rules-quiz-management.sln

      - name: Build .NET application
        run: dotnet build handball-belgium-rules-quiz-management.sln --configuration Release --no-restore

  validate-deployment-config:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure Web App exists and is accessible
        run: |
          echo "=== Azure Configuration Diagnostics ==="
          echo ""
          
          # Show current subscription
          echo "Current Subscription:"
          az account show --query "{name:name, id:id, state:state}" -o table
          echo ""
          
          # List all resource groups to see permissions
          echo "Resource Groups (service principal has access to):"
          az group list --query "[].{name:name, location:location}" -o table
          echo ""
          
          echo "Validating Azure Web App: ${{ secrets.AZURE_WEBAPP_NAME }}"
          echo ""
          
          # List all web apps to check visibility
          echo "Searching for web app in subscription..."
          WEB_APP_INFO=$(az webapp list --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME }}'] | [0].{name:name, resourceGroup:resourceGroup, state:state, location:location}" -o json 2>/dev/null)
          
          if [ "$WEB_APP_INFO" = "null" ] || [ -z "$WEB_APP_INFO" ]; then
            echo "✗ Web app '${{ secrets.AZURE_WEBAPP_NAME }}' not found in subscription"
            echo ""
            echo "Available web apps:"
            az webapp list --query "[].{name:name, resourceGroup:resourceGroup}" -o table
            exit 1
          fi
          
          RESOURCE_GROUP=$(echo "$WEB_APP_INFO" | jq -r '.resourceGroup')
          echo "✓ Found web app '${{ secrets.AZURE_WEBAPP_NAME }}' in resource group: $RESOURCE_GROUP"
          echo ""
          
          # Check current role assignments
          echo "Checking role assignments..."
          CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          RG_SCOPE="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RESOURCE_GROUP"
          
          ROLES=$(az role assignment list --assignee "$CLIENT_ID" --scope "$RG_SCOPE" --query "[].roleDefinitionName" -o tsv 2>/dev/null || echo "")
          
          if [ -n "$ROLES" ]; then
            echo "Assigned roles on resource group:"
            echo "$ROLES"
            echo ""
          fi
          
          # Try to access the web app directly (requires deployment permissions)
          echo "Testing web app access..."
          if az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group "$RESOURCE_GROUP" --query "name" -o tsv 2>/dev/null; then
            echo "✓ Service principal has deployment permissions"
            echo ""
            
            # Get web app details
            echo "Web App Details:"
            az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group "$RESOURCE_GROUP" --query "{name:name, resourceGroup:resourceGroup, state:state, defaultHostName:defaultHostName, kind:kind}" -o table
            echo ""
            
            # Test deployment credentials
            echo "Verifying deployment configuration..."
            PUBLISH_PROFILE=$(az webapp deployment list-publishing-profiles --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group "$RESOURCE_GROUP" --query "[0].publishUrl" -o tsv 2>/dev/null || echo "")
            
            if [ -n "$PUBLISH_PROFILE" ]; then
              echo "✓ Can access deployment settings"
            else
              echo "⚠️  Cannot access deployment settings (may not affect OIDC-based deployment)"
            fi
            echo ""
            
            echo "✅ Deployment configuration validated successfully!"
          else
            echo "⚠️  Cannot access web app with current permissions"
            echo ""
            echo "Current roles: ${ROLES:-None found}"
            echo ""
            echo "REQUIRED: Contributor or Website Contributor role"
            echo ""
            echo "To grant access, run:"
            echo "az role assignment create --assignee \"$CLIENT_ID\" --role 'Contributor' --scope \"$RG_SCOPE\""
            exit 1
          fi

      - name: Validate deployment settings
        run: |
          echo "Checking web app runtime settings..."
          
          # Get resource group from web app list
          RESOURCE_GROUP=$(az webapp list --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
          
          if [ -n "$RESOURCE_GROUP" ]; then
            az webapp config show --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group "$RESOURCE_GROUP" --query "{netFrameworkVersion:netFrameworkVersion, linuxFxVersion:linuxFxVersion, alwaysOn:alwaysOn}" -o table
            echo ""
            echo "✅ Configuration check complete"
          else
            echo "Could not determine resource group"
            exit 1
          fi