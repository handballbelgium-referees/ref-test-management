name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

env:
    DOTNET_VERSION: 10.0.x
    NODE_VERSION: 22

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Validate PR title
        run: echo "${{ github.event.pull_request.title }}" | npx commitlint

  validate:
    runs-on: ubuntu-latest
    needs: validate-pr-title
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install root dependencies
        run: npm ci

      - name: Install UI dependencies
        working-directory: ./QuizManagement.Ui
        run: npm ci

      - name: Build Angular application
        working-directory: ./QuizManagement.Ui
        run: npm run build -- --configuration production

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '${{ env.DOTNET_VERSION }}'

      - name: Restore .NET dependencies
        run: dotnet restore handball-belgium-rules-quiz-management.sln

      - name: Build .NET application
        run: dotnet build handball-belgium-rules-quiz-management.sln --configuration Release --no-restore

  validate-deployment-config:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure Web App exists and is accessible
        run: |
          echo "=== Azure Configuration Diagnostics ==="
          echo ""
          
          # Show current subscription
          echo "Current Subscription:"
          az account show --query "{name:name, id:id, state:state}" -o table
          echo ""
          
          # Show all subscriptions the service principal has access to
          echo "Available Subscriptions:"
          az account list --query "[].{name:name, id:id, state:state}" -o table
          echo ""
          
          echo "Validating Azure Web App: ${{ secrets.AZURE_WEBAPP_NAME }}"
          echo ""
          
          # Try to find the web app
          echo "Searching for web app in current subscription..."
          WEB_APP_FOUND=$(az webapp list --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME }}'].{name:name, resourceGroup:resourceGroup, state:state}" -o table)
          
          if [ -z "$WEB_APP_FOUND" ] || [ "$WEB_APP_FOUND" = "[]" ]; then
            echo "✗ Web app '${{ secrets.AZURE_WEBAPP_NAME }}' not found in current subscription"
            echo ""
            echo "Available web apps in this subscription:"
            az webapp list --query "[].{name:name, resourceGroup:resourceGroup, state:state, location:location}" -o table
            echo ""
            echo "Possible issues:"
            echo "  1. Web app name is incorrect (check AZURE_WEBAPP_NAME secret)"
            echo "  2. Web app is in a different subscription (check AZURE_SUBSCRIPTION_ID secret)"
            echo "  3. Service principal doesn't have 'Reader' or 'Contributor' role on the resource group"
            exit 1
          fi
          
          # Check if we can access the web app details
          if az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "name" -o tsv > /dev/null 2>&1; then
            echo "✓ Web app '${{ secrets.AZURE_WEBAPP_NAME }}' exists and is accessible"
            echo ""
            
            # Get web app details
            echo "Web App Details:"
            az webapp show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "{name:name, resourceGroup:resourceGroup, state:state, defaultHostName:defaultHostName, kind:kind}" -o table
            echo ""
            
            echo "✓ Deployment configuration validated successfully!"
          else
            echo "✗ Found web app but cannot access full details"
            echo "Service principal may need additional permissions"
            exit 1
          fi

      - name: Validate deployment settings
        run: |
          echo "Checking web app runtime settings..."
          az webapp config show --name ${{ secrets.AZURE_WEBAPP_NAME }} --query "{netFrameworkVersion:netFrameworkVersion, linuxFxVersion:linuxFxVersion, alwaysOn:alwaysOn}" -o table