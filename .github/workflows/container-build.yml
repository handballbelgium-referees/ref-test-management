name: 🧱 Build Tagged Container Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact semantic-release tag to build.
        required: true
        type: string
      target_environment:
        description: Target environment used to validate the release channel.
        required: true
        type: string
    outputs:
      validated-sha:
        description: Commit validated and used to build the image archives.
        value: ${{ jobs.build.outputs.validated-sha }}
      artifact-name:
        description: Name of the short-retention container build artifact.
        value: ${{ jobs.build.outputs.artifact-name }}
      image-tag:
        description: Unique local image tag used for this build.
        value: ${{ jobs.build.outputs.image-tag }}
      api-image-archive-sha256:
        description: SHA-256 digest of the API OCI archive.
        value: ${{ jobs.build.outputs.api-image-archive-sha256 }}
      worker-image-archive-sha256:
        description: SHA-256 digest of the Worker OCI archive.
        value: ${{ jobs.build.outputs.worker-image-archive-sha256 }}
      container-archives-sha256:
        description: SHA-256 digest covering both OCI archives.
        value: ${{ jobs.build.outputs.container-archives-sha256 }}
      node-version:
        description: Node.js version used by the build.
        value: ${{ jobs.build.outputs.node-version }}
      npm-version:
        description: npm version used by the build.
        value: ${{ jobs.build.outputs.npm-version }}
      dotnet-sdk-version:
        description: .NET SDK version used by the build.
        value: ${{ jobs.build.outputs.dotnet-sdk-version }}
      dotnet-sdks:
        description: Installed .NET SDKs on the build runner.
        value: ${{ jobs.build.outputs.dotnet-sdks }}
      dotnet-runtimes:
        description: Installed .NET runtimes on the build runner.
        value: ${{ jobs.build.outputs.dotnet-runtimes }}
      runner-os:
        description: GitHub-hosted runner operating system.
        value: ${{ jobs.build.outputs.runner-os }}
      runner-arch:
        description: GitHub-hosted runner architecture.
        value: ${{ jobs.build.outputs.runner-arch }}
      runner-image-os:
        description: GitHub-hosted runner image name.
        value: ${{ jobs.build.outputs.runner-image-os }}
      runner-image-version:
        description: GitHub-hosted runner image version.
        value: ${{ jobs.build.outputs.runner-image-version }}

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.303
  NODE_VERSION: 24.20.0

jobs:
  build:
    name: Build ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    outputs:
      validated-sha: ${{ steps.verify-source.outputs.sha }}
      artifact-name: ${{ steps.verify-source.outputs.artifact-name }}
      image-tag: ${{ steps.verify-source.outputs.image-tag }}
      api-image-archive-sha256: ${{ steps.publish.outputs.api-image-archive-sha256 }}
      worker-image-archive-sha256: ${{ steps.publish.outputs.worker-image-archive-sha256 }}
      container-archives-sha256: ${{ steps.publish.outputs.container-archives-sha256 }}
      node-version: ${{ steps.publish.outputs.node-version }}
      npm-version: ${{ steps.publish.outputs.npm-version }}
      dotnet-sdk-version: ${{ steps.publish.outputs.dotnet-sdk-version }}
      dotnet-sdks: ${{ steps.publish.outputs.dotnet-sdks }}
      dotnet-runtimes: ${{ steps.publish.outputs.dotnet-runtimes }}
      runner-os: ${{ steps.publish.outputs.runner-os }}
      runner-arch: ${{ steps.publish.outputs.runner-arch }}
      runner-image-os: ${{ steps.publish.outputs.runner-image-os }}
      runner-image-version: ${{ steps.publish.outputs.runner-image-version }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: 🔒 Verify release tag, channel, and source
        id: verify-source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            RELEASE_CHANNEL="alpha"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RELEASE_CHANNEL="stable"
          else
            echo "::error::Release tag must be a semantic-release alpha or stable tag."
            exit 1
          fi

          case "$TARGET_ENVIRONMENT:$RELEASE_CHANNEL" in
            testing:alpha|production:stable) ;;
            *)
              echo "::error::Alpha releases can target testing; stable releases can target production."
              exit 1
              ;;
          esac

          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::The selected release tag does not exist."
            exit 1
          fi
          TAG_SHA="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$TAG_SHA" != "$CHECKED_OUT_SHA" ]; then
            echo "::error::The tag commit does not match the checked out source."
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main || \
             ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
            echo "::error::The selected release tag is not reachable from main."
            exit 1
          fi
          if [ "$RELEASE_CHANNEL" = "stable" ] && \
             { ! git show-ref --verify --quiet refs/remotes/origin/release || \
               ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/release; }; then
            echo "::error::The selected stable tag is not reachable from release."
            exit 1
          fi

          echo "sha=$CHECKED_OUT_SHA" >> "$GITHUB_OUTPUT"
          echo "release-version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=container-${CHECKED_OUT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "image-tag=${CHECKED_OUT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install and verify npm 12.2.0
        run: |
          npm install --global npm@12.2.0
          ACTUAL_NPM_VERSION="$(npm --version)"
          if [ "$ACTUAL_NPM_VERSION" != "12.2.0" ]; then
            echo "::error::Expected npm 12.2.0, got $ACTUAL_NPM_VERSION."
            exit 1
          fi

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 🧪 Test npm audit policy checker
        run: node --test scripts/check-npm-audit.test.mjs scripts/release-safety.test.mjs

      - name: 🛡 Audit root and Angular dependencies
        run: node scripts/check-npm-audit.mjs

      - name: 📝 Inject release version into Angular
        env:
          APP_VERSION: ${{ steps.verify-source.outputs.release-version }}
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🌍 Check translation parity
        working-directory: ./RefTestManagement.Ui
        run: npm run check:i18n

      - name: 🧪 Run Angular unit tests
        working-directory: ./RefTestManagement.Ui
        run: npm test -- --watch=false --no-progress

      - name: 🗂 Prepare API static assets
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to API assets
        run: cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx --locked-mode -p:NuGetAuditMode=all -p:NuGetAuditLevel=low '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 🧪 Run .NET unit tests
        run: dotnet test --solution RefTestManagement.slnx --configuration Release --no-build -p:TestingPlatformShowTestsFailure=true

      - name: 📦 Publish API and Worker OCI archives
        id: publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          VALIDATED_SHA: ${{ steps.verify-source.outputs.sha }}
          IMAGE_TAG: ${{ steps.verify-source.outputs.image-tag }}
        run: |
          set -euo pipefail
          IMAGE_DIRECTORY="$GITHUB_WORKSPACE/release-artifact/images"
          mkdir -p "$IMAGE_DIRECTORY"
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            "-p:ContainerImageTag=$IMAGE_TAG" \
            "-p:ContainerArchiveOutputPath=$IMAGE_DIRECTORY/ref-test-management-api.tar.gz"
          dotnet publish RefTestManagement.Worker/RefTestManagement.Worker.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            "-p:ContainerImageTag=$IMAGE_TAG" \
            "-p:ContainerArchiveOutputPath=$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz"

          API_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-api.tar.gz" | cut -d ' ' -f 1)"
          WORKER_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz" | cut -d ' ' -f 1)"
          CONTAINER_ARCHIVES_SHA256="$(cd "$IMAGE_DIRECTORY" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          : "${ImageOS:?GitHub-hosted runner image name is required}"
          : "${ImageVersion:?GitHub-hosted runner image version is required}"
          NODE_TOOL_VERSION="$(node --version)"
          NPM_TOOL_VERSION="$(npm --version)"
          DOTNET_SDK_VERSION="$(dotnet --version)"
          DOTNET_SDKS="$(dotnet --list-sdks | tr '\n' ';')"
          DOTNET_RUNTIMES="$(dotnet --list-runtimes | tr '\n' ';')"
          {
            printf 'validated-sha=%s\nrelease-tag=%s\ntarget-environment=%s\nimage-tag=%s\n' \
              "$VALIDATED_SHA" "$RELEASE_TAG" "$TARGET_ENVIRONMENT" "$IMAGE_TAG"
            printf 'node-version=%s\nnpm-version=%s\n' "$NODE_TOOL_VERSION" "$NPM_TOOL_VERSION"
            printf 'dotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\n' \
              "$DOTNET_SDK_VERSION" "$DOTNET_SDKS" "$DOTNET_RUNTIMES"
            printf 'runner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            printf 'api-image-archive-sha256=%s\nworker-image-archive-sha256=%s\n' \
              "$API_IMAGE_ARCHIVE_SHA256" "$WORKER_IMAGE_ARCHIVE_SHA256"
            printf 'container-archives-sha256=%s\n' "$CONTAINER_ARCHIVES_SHA256"
          } > ./release-artifact/provenance.txt
          {
            printf 'api-image-archive-sha256=%s\nworker-image-archive-sha256=%s\n' \
              "$API_IMAGE_ARCHIVE_SHA256" "$WORKER_IMAGE_ARCHIVE_SHA256"
            printf 'container-archives-sha256=%s\n' "$CONTAINER_ARCHIVES_SHA256"
            printf 'node-version=%s\nnpm-version=%s\n' "$NODE_TOOL_VERSION" "$NPM_TOOL_VERSION"
            printf 'dotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\n' \
              "$DOTNET_SDK_VERSION" "$DOTNET_SDKS" "$DOTNET_RUNTIMES"
            printf 'runner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          } >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload container build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.verify-source.outputs.artifact-name }}
          path: ./release-artifact
          retention-days: 1
