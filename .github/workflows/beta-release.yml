name: 🧪 Beta Pre-release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.303
  NODE_VERSION: 24.20.0

jobs:
  validate:
    name: ✅ Validate Release Candidate
    runs-on: ubuntu-latest
    outputs:
      validated-sha: ${{ steps.candidate.outputs.sha }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🔒 Verify candidate commit
        id: candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Candidate checkout does not match the triggering commit."
            exit 1
          fi
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install and verify npm 12.2.0
        run: |
          npm install --global npm@12.2.0
          ACTUAL_NPM_VERSION="$(npm --version)"
          if [ "$ACTUAL_NPM_VERSION" != "12.2.0" ]; then
            echo "::error::Expected npm 12.2.0, got $ACTUAL_NPM_VERSION."
            exit 1
          fi

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🧪 Test npm audit policy checker
        run: node --test scripts/check-npm-audit.test.mjs scripts/release-safety.test.mjs

      - name: 🛡 Audit root and Angular dependencies
        run: node scripts/check-npm-audit.mjs

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🌍 Check translation parity
        working-directory: ./RefTestManagement.Ui
        run: npm run check:i18n

      - name: 🧪 Run Angular unit tests
        working-directory: ./RefTestManagement.Ui
        run: npm test -- --watch=false --no-progress

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx --locked-mode -p:NuGetAuditMode=all -p:NuGetAuditLevel=low '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 🧪 Run .NET unit tests
        run: dotnet test --solution RefTestManagement.slnx --configuration Release --no-build -p:TestingPlatformShowTestsFailure=true

  release:
    name: 🚀 Beta Pre-release
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
      new-release-tag: ${{ steps.semantic-release.outputs.new_release_tag }}
      new-release-sha: ${{ steps.semantic-release.outputs.new_release_sha }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false

      - name: 🔒 Verify validated source and main badge state
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$VALIDATED_SHA" ] || \
             ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::Release checkout does not match the validated candidate."
            exit 1
          fi
          REMOTE_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if [ "$REMOTE_MAIN_SHA" != "$VALIDATED_SHA" ]; then
            PARENTS="$(git rev-list --parents -n 1 "$REMOTE_MAIN_SHA")"
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$REMOTE_MAIN_SHA")"
            if [ "$PARENTS" != "$REMOTE_MAIN_SHA $VALIDATED_SHA" ] || \
               [ -z "$CHANGED_FILES" ] || \
               printf '%s\n' "$CHANGED_FILES" | grep -Ev '^badges/(release|pre-release)\.png$' >/dev/null; then
              echo "::error::main moved beyond the validated candidate with an unexpected commit."
              exit 1
            fi
          fi
          git checkout -B main "$REMOTE_MAIN_SHA"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      # Mint only after dependency installation; the token is injected into the release step below.
      - name: 🔑 Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 🏷 Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
          BADGE_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"
          LATEST_TAG_BEFORE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          npx semantic-release
          LATEST_TAG_AFTER="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ "$LATEST_TAG_BEFORE" != "$LATEST_TAG_AFTER" ] && [ -n "$LATEST_TAG_AFTER" ]; then
            TAG_SHA="$(git rev-parse --verify "${LATEST_TAG_AFTER}^{commit}")"
            if [ "$TAG_SHA" != "$VALIDATED_SHA" ]; then
              echo "::error::Release tag does not point to the validated candidate."
              exit 1
            fi
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${LATEST_TAG_AFTER#v}" >> "$GITHUB_OUTPUT"
            echo "new_release_tag=$LATEST_TAG_AFTER" >> "$GITHUB_OUTPUT"
            echo "new_release_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
            echo "new_release_tag=" >> "$GITHUB_OUTPUT"
            echo "new_release_sha=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: [release, validate]
    if: needs.release.outputs.new-release-published == 'true'
    outputs:
      validated-sha: ${{ steps.verify-source.outputs.sha }}
      artifact-name: ${{ steps.verify-source.outputs.artifact-name }}
      image-tag: ${{ steps.verify-source.outputs.image-tag }}
      api-image-archive-sha256: ${{ steps.publish.outputs.api-image-archive-sha256 }}
      worker-image-archive-sha256: ${{ steps.publish.outputs.worker-image-archive-sha256 }}
      container-archives-sha256: ${{ steps.publish.outputs.container-archives-sha256 }}
      node-version: ${{ steps.publish.outputs.node-version }}
      npm-version: ${{ steps.publish.outputs.npm-version }}
      dotnet-sdk-version: ${{ steps.publish.outputs.dotnet-sdk-version }}
      dotnet-sdks: ${{ steps.publish.outputs.dotnet-sdks }}
      dotnet-runtimes: ${{ steps.publish.outputs.dotnet-runtimes }}
      runner-os: ${{ steps.publish.outputs.runner-os }}
      runner-arch: ${{ steps.publish.outputs.runner-arch }}
      runner-image-os: ${{ steps.publish.outputs.runner-image-os }}
      runner-image-version: ${{ steps.publish.outputs.runner-image-version }}
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout validated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.validated-sha }}
          persist-credentials: false

      - name: 🔒 Verify validated source and release tag
        id: verify-source
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
          RELEASE_SHA: ${{ needs.release.outputs.new-release-sha }}
          RELEASE_TAG: ${{ needs.release.outputs.new-release-tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.new-release-version }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if [ "$ACTUAL_SHA" != "$VALIDATED_SHA" ] || \
             [ "$RELEASE_SHA" != "$VALIDATED_SHA" ] || \
             [ "$TAG_SHA" != "$VALIDATED_SHA" ] || \
             [ "${RELEASE_TAG#v}" != "$RELEASE_VERSION" ]; then
            echo "::error::Build source, release tag, and validated candidate do not match."
            exit 1
          fi
          echo "sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact-name=dist-$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "image-tag=${ACTUAL_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: 🏷 Set version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new-release-version }}
        run: |
          echo "APP_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "Building version $RELEASE_VERSION"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install and verify npm 12.2.0
        run: |
          npm install --global npm@12.2.0
          ACTUAL_NPM_VERSION="$(npm --version)"
          if [ "$ACTUAL_NPM_VERSION" != "12.2.0" ]; then
            echo "::error::Expected npm 12.2.0, got $ACTUAL_NPM_VERSION."
            exit 1
          fi

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🗂 Prepare wwwroot folder
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to .NET wwwroot
        run: |
          cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx --locked-mode -p:NuGetAuditMode=all -p:NuGetAuditLevel=low '-warnaserror:NU1901;NU1902;NU1903;NU1904'

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 📦 Publish .NET application
        id: publish
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
          RELEASE_TAG: ${{ needs.release.outputs.new-release-tag }}
          IMAGE_TAG: ${{ steps.verify-source.outputs.image-tag }}
        run: |
          set -euo pipefail
          IMAGE_DIRECTORY="$GITHUB_WORKSPACE/release-artifact/images"
          mkdir -p "$IMAGE_DIRECTORY"
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            "-p:ContainerImageTag=$IMAGE_TAG" \
            "-p:ContainerArchiveOutputPath=$IMAGE_DIRECTORY/ref-test-management-api.tar.gz"
          dotnet publish RefTestManagement.Worker/RefTestManagement.Worker.csproj \
            --configuration Release \
            --no-restore \
            /t:PublishContainer \
            -p:ContainerRuntimeIdentifier=linux-x64 \
            "-p:ContainerImageTag=$IMAGE_TAG" \
            "-p:ContainerArchiveOutputPath=$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz"

          API_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-api.tar.gz" | cut -d ' ' -f 1)"
          WORKER_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz" | cut -d ' ' -f 1)"
          CONTAINER_ARCHIVES_SHA256="$(cd "$IMAGE_DIRECTORY" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          : "${ImageOS:?GitHub-hosted runner image name is required}"
          : "${ImageVersion:?GitHub-hosted runner image version is required}"
          NODE_TOOL_VERSION="$(node --version)"
          NPM_TOOL_VERSION="$(npm --version)"
          DOTNET_SDK_VERSION="$(dotnet --version)"
          DOTNET_SDKS="$(dotnet --list-sdks | tr '\n' ';')"
          DOTNET_RUNTIMES="$(dotnet --list-runtimes | tr '\n' ';')"
          {
            printf 'validated-sha=%s\nrelease-tag=%s\nimage-tag=%s\n' \
              "$VALIDATED_SHA" "$RELEASE_TAG" "$IMAGE_TAG"
            printf 'node-version=%s\nnpm-version=%s\n' "$NODE_TOOL_VERSION" "$NPM_TOOL_VERSION"
            printf 'dotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\n' \
              "$DOTNET_SDK_VERSION" "$DOTNET_SDKS" "$DOTNET_RUNTIMES"
            printf 'runner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            printf 'api-image-archive-sha256=%s\nworker-image-archive-sha256=%s\n' \
              "$API_IMAGE_ARCHIVE_SHA256" "$WORKER_IMAGE_ARCHIVE_SHA256"
            printf 'container-archives-sha256=%s\n' "$CONTAINER_ARCHIVES_SHA256"
          } > ./release-artifact/provenance.txt
          {
            printf 'api-image-archive-sha256=%s\nworker-image-archive-sha256=%s\n' \
              "$API_IMAGE_ARCHIVE_SHA256" "$WORKER_IMAGE_ARCHIVE_SHA256"
            printf 'container-archives-sha256=%s\n' "$CONTAINER_ARCHIVES_SHA256"
            printf 'node-version=%s\nnpm-version=%s\n' "$NODE_TOOL_VERSION" "$NPM_TOOL_VERSION"
            printf 'dotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\n' \
              "$DOTNET_SDK_VERSION" "$DOTNET_SDKS" "$DOTNET_RUNTIMES"
            printf 'runner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
          } >> "$GITHUB_OUTPUT"
          echo "image-tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.verify-source.outputs.artifact-name }}
          path: ./release-artifact
          retention-days: 1

  deploy-testing:
    name: 🧪 Deploy to Testing v${{needs.release.outputs.new-release-version}}
    runs-on: ubuntu-latest
    needs: [release, build, validate]
    if: needs.release.outputs.new-release-published == 'true'
    timeout-minutes: 75
    environment:
      name: testing
      url: ${{ steps.deploy.outputs.api-url }}
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
      AZURE_DEPLOYMENT_MODE: ${{ vars.AZURE_DEPLOYMENT_MODE }}

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ github.workspace }}/release-artifact

      - name: 🔒 Verify deployment artifact provenance
        env:
          VALIDATED_SHA: ${{ needs.validate.outputs.validated-sha }}
          BUILD_SHA: ${{ needs.build.outputs.validated-sha }}
          RELEASE_SHA: ${{ needs.release.outputs.new-release-sha }}
          RELEASE_TAG: ${{ needs.release.outputs.new-release-tag }}
          BUILD_IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          BUILD_NODE_VERSION: ${{ needs.build.outputs.node-version }}
          BUILD_NPM_VERSION: ${{ needs.build.outputs.npm-version }}
          BUILD_API_IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.api-image-archive-sha256 }}
          BUILD_WORKER_IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.worker-image-archive-sha256 }}
          BUILD_CONTAINER_ARCHIVES_SHA256: ${{ needs.build.outputs.container-archives-sha256 }}
          BUILD_DOTNET_SDK_VERSION: ${{ needs.build.outputs.dotnet-sdk-version }}
          BUILD_DOTNET_SDKS: ${{ needs.build.outputs.dotnet-sdks }}
          BUILD_DOTNET_RUNTIMES: ${{ needs.build.outputs.dotnet-runtimes }}
          BUILD_RUNNER_OS: ${{ needs.build.outputs.runner-os }}
          BUILD_RUNNER_ARCH: ${{ needs.build.outputs.runner-arch }}
          BUILD_RUNNER_IMAGE_OS: ${{ needs.build.outputs.runner-image-os }}
          BUILD_RUNNER_IMAGE_VERSION: ${{ needs.build.outputs.runner-image-version }}
        run: |
          set -euo pipefail
          if [ "$VALIDATED_SHA" != "$BUILD_SHA" ] || [ "$VALIDATED_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Deployment source does not match the validated candidate."
            exit 1
          fi
          EXPECTED_PROVENANCE="$(printf 'validated-sha=%s\nrelease-tag=%s\nimage-tag=%s\nnode-version=%s\nnpm-version=%s\ndotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\nrunner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s' \
            "$VALIDATED_SHA" "$RELEASE_TAG" "$BUILD_IMAGE_TAG" "$BUILD_NODE_VERSION" "$BUILD_NPM_VERSION" \
            "$BUILD_DOTNET_SDK_VERSION" "$BUILD_DOTNET_SDKS" "$BUILD_DOTNET_RUNTIMES" \
            "$BUILD_RUNNER_OS" "$BUILD_RUNNER_ARCH" "$BUILD_RUNNER_IMAGE_OS" "$BUILD_RUNNER_IMAGE_VERSION")"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"api-image-archive-sha256=${BUILD_API_IMAGE_ARCHIVE_SHA256}"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"worker-image-archive-sha256=${BUILD_WORKER_IMAGE_ARCHIVE_SHA256}"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"container-archives-sha256=${BUILD_CONTAINER_ARCHIVES_SHA256}"
          ACTUAL_PROVENANCE="$(cat "$GITHUB_WORKSPACE/release-artifact/provenance.txt")"
          if [ "$ACTUAL_PROVENANCE" != "$EXPECTED_PROVENANCE" ]; then
            echo "::error::Deployment artifact provenance does not match the validated release."
            exit 1
          fi
          IMAGE_DIRECTORY="$GITHUB_WORKSPACE/release-artifact/images"
          ACTUAL_API_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-api.tar.gz" | cut -d ' ' -f 1)"
          ACTUAL_WORKER_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz" | cut -d ' ' -f 1)"
          ACTUAL_CONTAINER_ARCHIVES_SHA256="$(cd "$IMAGE_DIRECTORY" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          if [ "$BUILD_API_IMAGE_ARCHIVE_SHA256" != "$ACTUAL_API_IMAGE_ARCHIVE_SHA256" ] || \
             [ "$BUILD_WORKER_IMAGE_ARCHIVE_SHA256" != "$ACTUAL_WORKER_IMAGE_ARCHIVE_SHA256" ] || \
             [ "$BUILD_CONTAINER_ARCHIVES_SHA256" != "$ACTUAL_CONTAINER_ARCHIVES_SHA256" ]; then
            echo "::error::Container image archive digests do not match the validated build."
            exit 1
          fi

      - name: 🔑 Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🐳 Push immutable images and run migration
        id: prepare-deployment
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          set -euo pipefail
          : "${AZURE_ACR_NAME:?Set the testing AZURE_ACR_NAME environment variable.}"
          : "${AZURE_RESOURCE_GROUP_NAME:?Set the testing AZURE_RESOURCE_GROUP_NAME environment variable.}"
          : "${AZURE_NAME_PREFIX:?Set the testing AZURE_NAME_PREFIX environment variable.}"
          : "${AZURE_UNIQUE_SUFFIX:?Set the testing AZURE_UNIQUE_SUFFIX environment variable.}"
          : "${AZURE_DEPLOYMENT_MODE:?Set the testing AZURE_DEPLOYMENT_MODE environment variable.}"

          case "$AZURE_DEPLOYMENT_MODE" in
            single|split) ;;
            *)
              echo "::error::AZURE_DEPLOYMENT_MODE must be single or split."
              exit 1
              ;;
          esac

          BASE_NAME="${AZURE_NAME_PREFIX}-${AZURE_UNIQUE_SUFFIX}"
          MIGRATION_JOB_NAME="${BASE_NAME}-migration"
          API_LOCAL_IMAGE="ref-test-management-api:${IMAGE_TAG}"
          WORKER_LOCAL_IMAGE="ref-test-management-worker:${IMAGE_TAG}"
          docker load --input "$GITHUB_WORKSPACE/release-artifact/images/ref-test-management-api.tar.gz"
          docker load --input "$GITHUB_WORKSPACE/release-artifact/images/ref-test-management-worker.tar.gz"
          docker image inspect "$API_LOCAL_IMAGE" >/dev/null
          docker image inspect "$WORKER_LOCAL_IMAGE" >/dev/null

          az acr login --name "$AZURE_ACR_NAME"
          ACR_LOGIN_SERVER="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          if [ -z "$ACR_LOGIN_SERVER" ] || [ "$ACR_LOGIN_SERVER" = "None" ]; then
            echo "::error::Azure Container Registry login server could not be resolved."
            exit 1
          fi

          API_TAGGED_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-api:${IMAGE_TAG}"
          WORKER_TAGGED_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-worker:${IMAGE_TAG}"
          docker tag "$API_LOCAL_IMAGE" "$API_TAGGED_IMAGE"
          docker tag "$WORKER_LOCAL_IMAGE" "$WORKER_TAGGED_IMAGE"
          docker push "$API_TAGGED_IMAGE"
          docker push "$WORKER_TAGGED_IMAGE"

          API_DIGEST="$(az acr repository show --name "$AZURE_ACR_NAME" \
            --image "ref-test-management-api:${IMAGE_TAG}" --query digest --output tsv)"
          WORKER_DIGEST="$(az acr repository show --name "$AZURE_ACR_NAME" \
            --image "ref-test-management-worker:${IMAGE_TAG}" --query digest --output tsv)"
          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ACR did not return valid immutable image digests."
            exit 1
          fi

          API_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-api@${API_DIGEST}"
          WORKER_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-worker@${WORKER_DIGEST}"
          az containerapp job update \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --image "$WORKER_IMAGE" \
            --output none

          PREVIOUS_EXECUTION="$(az containerapp job execution list \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query 'sort_by(@, &properties.startTime)[-1].name' \
            --output tsv || true)"
          az containerapp job start \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --output none

          EXECUTION_NAME=""
          for attempt in {1..30}; do
            LATEST_EXECUTION="$(az containerapp job execution list \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --query 'sort_by(@, &properties.startTime)[-1].name' \
              --output tsv)"
            if [ -n "$LATEST_EXECUTION" ] && \
               [ "$LATEST_EXECUTION" != "None" ] && \
               [ "$LATEST_EXECUTION" != "$PREVIOUS_EXECUTION" ]; then
              EXECUTION_NAME="$LATEST_EXECUTION"
              break
            fi
            sleep 2
          done
          if [ -z "$EXECUTION_NAME" ]; then
            echo "::error::Azure did not report the migration job execution started by this deployment."
            exit 1
          fi

          MIGRATION_SUCCEEDED=false
          for attempt in {1..390}; do
            STATUS="$(az containerapp job execution show \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status \
              --output tsv)"
            case "$STATUS" in
              Succeeded)
                MIGRATION_SUCCEEDED=true
                break
                ;;
              Failed|Stopped)
                echo "::error::Migration execution ended with status '$STATUS'."
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          if [ "$MIGRATION_SUCCEEDED" != true ]; then
            echo "::error::Migration execution did not complete within the 65-minute deployment timeout."
            exit 1
          fi

          {
            printf 'api-image=%s\n' "$API_IMAGE"
            printf 'worker-image=%s\n' "$WORKER_IMAGE"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### Testing image digests\n\n'
            printf '* API: `%s`\n' "$API_IMAGE"
            printf '* Worker: `%s`\n' "$WORKER_IMAGE"
            printf '* Migration execution: `%s`\n' "$EXECUTION_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Deploy immutable Container Apps revisions
        id: deploy
        env:
          API_IMAGE: ${{ steps.prepare-deployment.outputs.api-image }}
          WORKER_IMAGE: ${{ steps.prepare-deployment.outputs.worker-image }}
        run: |
          set -euo pipefail
          BASE_NAME="${AZURE_NAME_PREFIX}-${AZURE_UNIQUE_SUFFIX}"
          API_APP_NAME="${BASE_NAME}-api"
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --image "$API_IMAGE" \
            --output none

          if [ "$AZURE_DEPLOYMENT_MODE" = "split" ]; then
            WORKER_APP_NAME="${BASE_NAME}-worker"
            az containerapp update \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --image "$WORKER_IMAGE" \
              --output none
          fi

          API_FQDN="$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          if [ -z "$API_FQDN" ] || [ "$API_FQDN" = "None" ]; then
            echo "::error::The deployed API Container App did not return an ingress hostname."
            exit 1
          fi
          echo "api-url=https://$API_FQDN" >> "$GITHUB_OUTPUT"
