name: 🧪 Beta Pre-release

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  release:
    name: 🚀 Beta Pre-release
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LATEST_TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          npx semantic-release
          LATEST_TAG_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$LATEST_TAG_BEFORE" != "$LATEST_TAG_AFTER" ] && [ -n "$LATEST_TAG_AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$LATEST_TAG_AFTER" >> $GITHUB_OUTPUT
            VERSION="${LATEST_TAG_AFTER#v}"
            TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git add badges/*.png
            if ! git diff --cached --quiet; then
              git commit -m "ci(release): update badges to v${VERSION} [skip ci]"
              git push origin HEAD:refs/heads/${TARGET_BRANCH}
            fi
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=''" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: 🏷 Get version from Git tag
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🗂 Prepare wwwroot folder
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to .NET wwwroot
        run: |
          cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 📦 Publish .NET application
        run: |
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./publish
          retention-days: 1

  deploy-testing:
    name: 🧪 Deploy to Testing ${{needs.release.outputs.new-release-version}}
    runs-on: ubuntu-latest
    needs: [release, build]
    environment:
      name: testing
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ github.workspace }}/publish

      - name: 🔑 Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (Testing)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_TESTING_NAME }}
          package: ${{ github.workspace }}/publish
          clean: true
