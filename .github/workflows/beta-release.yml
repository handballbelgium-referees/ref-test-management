name: 🧪 Beta Pre-release

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 24

jobs:
  release:
    name: 🚀 Beta Pre-release
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 🔒 Require GitHub App credentials
        env:
          RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$RELEASE_APP_CLIENT_ID" ] || [ -z "$RELEASE_APP_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY must be configured; refusing to release."
            exit 1
          fi

      # Mints an installation token that expires in an hour and carries only the permissions
      # granted to the app.
      - name: 🔑 Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          LATEST_TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          npx semantic-release
          LATEST_TAG_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$LATEST_TAG_BEFORE" != "$LATEST_TAG_AFTER" ] && [ -n "$LATEST_TAG_AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$LATEST_TAG_AFTER" >> $GITHUB_OUTPUT
            VERSION="${LATEST_TAG_AFTER#v}"
            TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git add badges/*.png
            if ! git diff --cached --quiet; then
              git commit -m "ci(release): update badges to v${VERSION} [skip ci]"
              git push origin HEAD:refs/heads/${TARGET_BRANCH}
            fi
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=''" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: [release, validate]
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.new-release-version }}
          persist-credentials: false

      - name: 🏷 Set version
        run: |
          VERSION="${{ needs.release.outputs.new-release-version }}"
          echo "APP_VERSION=${VERSION#v}" >> $GITHUB_ENV
          echo "Building version ${VERSION#v}"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🗂 Prepare wwwroot folder
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to .NET wwwroot
        run: |
          cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 📦 Publish .NET application
        run: |
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: ./publish
          retention-days: 1

  validate:
    name: ✅ Validate Release Candidate
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.new-release-version }}
          persist-credentials: false

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install root dependencies
        run: npm ci

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🌍 Check translation parity
        working-directory: ./RefTestManagement.Ui
        run: npm run check:i18n

      - name: 🧪 Run Angular unit tests
        working-directory: ./RefTestManagement.Ui
        run: npm test -- --watch=false --no-progress

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.slnx

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.slnx --configuration Release --no-restore

      - name: 🧪 Run .NET unit tests
        run: dotnet test --solution RefTestManagement.slnx --configuration Release --no-build -p:TestingPlatformShowTestsFailure=true

  deploy-testing:
    name: 🧪 Deploy to Testing ${{needs.release.outputs.new-release-version}}
    runs-on: ubuntu-latest
    needs: [release, build]
    environment:
      name: testing
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: ${{ github.workspace }}/publish

      - name: 🔑 Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (Testing)
        id: deploy
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_TESTING_NAME }}
          package: ${{ github.workspace }}/publish
          clean: true
