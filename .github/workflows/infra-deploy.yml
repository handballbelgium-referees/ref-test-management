name: 🏗 Azure Infrastructure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Azure environment to plan or apply.
        required: true
        type: choice
        options:
          - testing
          - production
      operation:
        description: Plan by default; apply requires a second environment approval after plan review.
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      create_applications:
        description: Enable apps when first creating them; existing apps remain enabled from Terraform state.
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Terraform plan (${{ inputs.target_environment }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ inputs.target_environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      plan-sha256: ${{ steps.plan.outputs.sha256 }}
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      database-provider: ${{ steps.configuration.outputs.database-provider }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      OPERATION: ${{ inputs.operation }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'Belgium Central' }}
      TF_VAR_name_prefix: ${{ vars.AZURE_NAME_PREFIX }}
      TF_VAR_unique_suffix: ${{ vars.AZURE_UNIQUE_SUFFIX }}
      TF_VAR_acr_name: ${{ vars.AZURE_ACR_NAME }}
      TF_VAR_acr_resource_group_name: ${{ vars.AZURE_ACR_RESOURCE_GROUP_NAME }}
      TF_VAR_sql_server_name: ${{ vars.AZURE_SQL_SERVER_NAME }}
      TF_VAR_database_provider: ${{ vars.AZURE_DATABASE_PROVIDER || 'SqlServer' }}
      TF_VAR_allow_managed_database_providers: ${{ vars.AZURE_ALLOW_MANAGED_DATABASE_PROVIDERS || 'false' }}
      TF_VAR_database_admin_login: ${{ vars.AZURE_DATABASE_ADMIN_LOGIN || 'rtm_dbadmin' }}
      TF_VAR_database_admin_password_wo_version: ${{ vars.AZURE_DATABASE_ADMIN_PASSWORD_VERSION || '1' }}
      TF_VAR_key_vault_name: ${{ vars.AZURE_KEY_VAULT_NAME }}
      TF_VAR_sql_entra_admin_login_username: ${{ vars.AZURE_SQL_ENTRA_ADMIN_LOGIN_USERNAME }}
      TF_VAR_sql_entra_admin_object_id: ${{ vars.AZURE_SQL_ENTRA_ADMIN_OBJECT_ID }}
      TF_VAR_api_image_digest: ${{ vars.AZURE_API_IMAGE_DIGEST }}
      TF_VAR_worker_image_digest: ${{ vars.AZURE_WORKER_IMAGE_DIGEST }}
      TF_VAR_deployment_mode: ${{ vars.AZURE_DEPLOYMENT_MODE || 'single' }}
      TF_VAR_allow_split_mode: ${{ vars.AZURE_ALLOW_SPLIT_MODE || 'false' }}
      TF_VAR_create_applications: ${{ inputs.create_applications }}
      TF_VAR_api_max_replicas: ${{ vars.AZURE_API_MAX_REPLICAS || '1' }}
      TF_VAR_api_trusted_proxy_networks: ${{ vars.AZURE_API_TRUSTED_PROXY_NETWORKS_JSON || '[]' }}
      TF_VAR_sql_firewall_ip_addresses: ${{ vars.AZURE_SQL_FIREWALL_IP_ADDRESSES_JSON || '[]' }}
      TF_VAR_key_vault_firewall_enabled: ${{ vars.AZURE_KEY_VAULT_FIREWALL_ENABLED || 'false' }}
      TF_VAR_key_vault_allowed_ip_addresses: ${{ vars.AZURE_KEY_VAULT_ALLOWED_IP_ADDRESSES_JSON || '[]' }}
      TF_VAR_auth0_domain: ${{ vars.AUTH0_DOMAIN }}
      TF_VAR_auth0_client_id: ${{ vars.AUTH0_CLIENT_ID }}
      TF_VAR_auth0_audience: ${{ vars.AUTH0_AUDIENCE }}
      TF_VAR_auth0_management_client_id: ${{ vars.AUTH0_MANAGEMENT_CLIENT_ID }}
      TF_VAR_email_base_url: ${{ vars.EMAIL_BASE_URL }}
      TF_VAR_email_from_email: ${{ vars.EMAIL_FROM_EMAIL }}
      TF_VAR_email_from_name: ${{ vars.EMAIL_FROM_NAME }}
      TF_VAR_rules_questions_url: ${{ vars.RULES_QUESTIONS_URL }}
      TF_VAR_log_analytics_daily_quota_gb: ${{ vars.AZURE_LOG_ANALYTICS_DAILY_QUOTA_GB || '1' }}
      AZURE_STATE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_STATE_RESOURCE_GROUP_NAME }}
      AZURE_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STATE_STORAGE_ACCOUNT_NAME }}
      AZURE_STATE_CONTAINER_NAME: ${{ vars.AZURE_STATE_CONTAINER_NAME }}

    steps:
      - name: 📥 Checkout dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: 🔎 Validate dispatch configuration
        id: configuration
        shell: bash
        env:
          DATABASE_ADMIN_PASSWORD_PRESENT: ${{ secrets.AZURE_DATABASE_ADMIN_PASSWORD != '' }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            testing|production) ;;
            *)
              echo "::error::Unsupported target environment."
              exit 1
              ;;
          esac
          case "$OPERATION" in
            plan|apply) ;;
            *)
              echo "::error::Unsupported Terraform operation."
              exit 1
              ;;
          esac
          : "${ARM_CLIENT_ID:?Configure the environment's AZURE_CLIENT_ID secret.}"
          : "${ARM_TENANT_ID:?Configure the environment's AZURE_TENANT_ID secret.}"
          : "${ARM_SUBSCRIPTION_ID:?Configure the environment's AZURE_SUBSCRIPTION_ID secret.}"
          : "${AZURE_STATE_RESOURCE_GROUP_NAME:?Configure the Azure state resource group variable.}"
          : "${AZURE_STATE_STORAGE_ACCOUNT_NAME:?Configure the Azure state storage account variable.}"
          : "${AZURE_STATE_CONTAINER_NAME:?Configure the Azure state container variable.}"
          : "${TF_VAR_resource_group_name:?Configure the environment's AZURE_RESOURCE_GROUP_NAME variable.}"
          : "${TF_VAR_name_prefix:?Configure the environment's AZURE_NAME_PREFIX variable.}"
          : "${TF_VAR_unique_suffix:?Configure the environment's AZURE_UNIQUE_SUFFIX variable.}"
          : "${TF_VAR_acr_name:?Configure the environment's AZURE_ACR_NAME variable.}"
          : "${TF_VAR_acr_resource_group_name:?Configure the environment's AZURE_ACR_RESOURCE_GROUP_NAME variable.}"
          : "${TF_VAR_key_vault_name:?Configure the environment's AZURE_KEY_VAULT_NAME variable.}"
          : "${TF_VAR_api_image_digest:?Configure the current immutable API image digest variable.}"
          : "${TF_VAR_worker_image_digest:?Configure the current immutable Worker image digest variable.}"
          : "${TF_VAR_auth0_domain:?Configure the environment's AUTH0_DOMAIN variable.}"
          : "${TF_VAR_auth0_client_id:?Configure the environment's AUTH0_CLIENT_ID variable.}"
          : "${TF_VAR_auth0_audience:?Configure the environment's AUTH0_AUDIENCE variable.}"
          : "${TF_VAR_auth0_management_client_id:?Configure the environment's AUTH0_MANAGEMENT_CLIENT_ID variable.}"
          : "${TF_VAR_email_base_url:?Configure the environment's EMAIL_BASE_URL variable.}"
          : "${TF_VAR_email_from_email:?Configure the environment's EMAIL_FROM_EMAIL variable.}"
          : "${TF_VAR_email_from_name:?Configure the environment's EMAIL_FROM_NAME variable.}"
          : "${TF_VAR_rules_questions_url:?Configure the environment's RULES_QUESTIONS_URL variable.}"
          case "$TF_VAR_database_provider" in
            SqlServer)
              : "${TF_VAR_sql_server_name:?Configure the environment's AZURE_SQL_SERVER_NAME variable.}"
              : "${TF_VAR_sql_entra_admin_login_username:?Configure the SQL Entra administrator login variable.}"
              : "${TF_VAR_sql_entra_admin_object_id:?Configure the SQL Entra administrator object ID variable.}"
              ;;
            PostgreSQL|MySQL)
              if [ "$TF_VAR_allow_managed_database_providers" != "true" ]; then
                echo "::error::Set AZURE_ALLOW_MANAGED_DATABASE_PROVIDERS=true to opt into managed PostgreSQL/MySQL costs."
                exit 1
              fi
              : "${TF_VAR_database_admin_login:?Configure the AZURE_DATABASE_ADMIN_LOGIN variable.}"
              if [ "$DATABASE_ADMIN_PASSWORD_PRESENT" != "true" ]; then
                echo "::error::Configure the AZURE_DATABASE_ADMIN_PASSWORD secret in the selected GitHub Environment."
                exit 1
              fi
              ;;
            SQLite)
              if [ "$TF_VAR_deployment_mode" != "single" ]; then
                echo "::error::SQLite requires AZURE_DEPLOYMENT_MODE=single."
                exit 1
              fi
              ;;
            *)
              echo "::error::AZURE_DATABASE_PROVIDER must be SqlServer, PostgreSQL, MySQL, or SQLite."
              exit 1
              ;;
          esac
          printf 'database-provider=%s\n' "$TF_VAR_database_provider" >> "$GITHUB_OUTPUT"

      - name: 🧹 Format Terraform (offline)
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra/terraform

      - name: 🔑 Request Azure OIDC token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable for this job.}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC is unavailable for this job.}"
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            --header "Authorization: ******" \
            --get \
            --data-urlencode "audience=api://AzureADTokenExchange" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          ARM_OIDC_TOKEN="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$ARM_OIDC_TOKEN"
          printf 'ARM_OIDC_TOKEN=%s\n' "$ARM_OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: 📋 Create and display Terraform plan
        id: plan
        shell: bash
        env:
          TF_VAR_database_admin_password_wo: ${{ secrets.AZURE_DATABASE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            testing)
              TERRAFORM_ROOT="infra/terraform/environments/testing"
              STATE_KEY="testing.tfstate"
              ;;
            production)
              TERRAFORM_ROOT="infra/terraform/environments/production"
              STATE_KEY="production.tfstate"
              ;;
            *)
              echo "::error::Unsupported target environment."
              exit 1
              ;;
          esac

          backend_config=(
            "-backend-config=resource_group_name=${AZURE_STATE_RESOURCE_GROUP_NAME}"
            "-backend-config=storage_account_name=${AZURE_STATE_STORAGE_ACCOUNT_NAME}"
            "-backend-config=container_name=${AZURE_STATE_CONTAINER_NAME}"
            "-backend-config=key=${STATE_KEY}"
            "-backend-config=subscription_id=${ARM_SUBSCRIPTION_ID}"
            "-backend-config=tenant_id=${ARM_TENANT_ID}"
            "-backend-config=client_id=${ARM_CLIENT_ID}"
            "-backend-config=use_azuread_auth=true"
            "-backend-config=use_oidc=true"
          )

          terraform "-chdir=$TERRAFORM_ROOT" init -input=false "${backend_config[@]}"
          terraform "-chdir=$TERRAFORM_ROOT" validate

          if [ "$TF_VAR_create_applications" != "true" ]; then
            if ! CURRENT_STATE="$(terraform "-chdir=$TERRAFORM_ROOT" state list 2>&1)"; then
              if [[ "$CURRENT_STATE" == *"No state file was found!"* ]]; then
                CURRENT_STATE=""
              else
                printf '%s\n' "$CURRENT_STATE" >&2
                exit 1
              fi
            fi
            if [[ "$CURRENT_STATE" == *"azurerm_container_app.api[0]"* ]]; then
              echo "::notice::Container Apps already exist in Terraform state; preserving them."
              export TF_VAR_create_applications=true
            fi
          fi

          PLAN_PATH="$RUNNER_TEMP/${TARGET_ENVIRONMENT}.tfplan"
          terraform "-chdir=$TERRAFORM_ROOT" plan -input=false -lock-timeout=5m -out="$PLAN_PATH"
          terraform "-chdir=$TERRAFORM_ROOT" show -no-color "$PLAN_PATH" | tee "$RUNNER_TEMP/plan.txt"
          cat "$RUNNER_TEMP/plan.txt" >> "$GITHUB_STEP_SUMMARY"

          PLAN_SHA256="$(sha256sum "$PLAN_PATH" | cut -d ' ' -f 1)"
          ARTIFACT_NAME="terraform-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET_ENVIRONMENT}"
          printf 'sha256=%s\n' "$PLAN_SHA256" >> "$GITHUB_OUTPUT"
          printf 'artifact-name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          if [ "$OPERATION" = "apply" ]; then
            echo "A separate protected apply job will require approval before applying this exact plan."
          fi

      - name: 📤 Upload saved plan for the protected apply job
        if: inputs.operation == 'apply'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ inputs.target_environment }}.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform apply (${{ inputs.target_environment }})
    if: github.ref == 'refs/heads/main' && inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ inputs.target_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      AZURE_DATABASE_PROVIDER: ${{ vars.AZURE_DATABASE_PROVIDER || 'SqlServer' }}
      ALLOW_MANAGED_DATABASE_PROVIDERS: ${{ vars.AZURE_ALLOW_MANAGED_DATABASE_PROVIDERS || 'false' }}
      DATABASE_ADMIN_PASSWORD_PRESENT: ${{ secrets.AZURE_DATABASE_ADMIN_PASSWORD != '' }}
      PLANNED_DATABASE_PROVIDER: ${{ needs.plan.outputs.database-provider }}
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      AZURE_STATE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_STATE_RESOURCE_GROUP_NAME }}
      AZURE_STATE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STATE_STORAGE_ACCOUNT_NAME }}
      AZURE_STATE_CONTAINER_NAME: ${{ vars.AZURE_STATE_CONTAINER_NAME }}
      EXPECTED_PLAN_SHA256: ${{ needs.plan.outputs.plan-sha256 }}

    steps:
      - name: 📥 Checkout the exact planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: 🔎 Validate apply configuration
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            testing|production) ;;
            *)
              echo "::error::Unsupported target environment."
              exit 1
              ;;
          esac
          : "${ARM_CLIENT_ID:?Configure the environment's AZURE_CLIENT_ID secret.}"
          : "${ARM_TENANT_ID:?Configure the environment's AZURE_TENANT_ID secret.}"
          : "${ARM_SUBSCRIPTION_ID:?Configure the environment's AZURE_SUBSCRIPTION_ID secret.}"
          : "${AZURE_STATE_RESOURCE_GROUP_NAME:?Configure the Azure state resource group variable.}"
          : "${AZURE_STATE_STORAGE_ACCOUNT_NAME:?Configure the Azure state storage account variable.}"
          : "${AZURE_STATE_CONTAINER_NAME:?Configure the Azure state container variable.}"
          : "${EXPECTED_PLAN_SHA256:?The plan job did not produce a digest.}"
          if [ "$AZURE_DATABASE_PROVIDER" != "$PLANNED_DATABASE_PROVIDER" ]; then
            echo "::error::AZURE_DATABASE_PROVIDER changed after the reviewed Terraform plan was created."
            exit 1
          fi
          case "$AZURE_DATABASE_PROVIDER" in
            SqlServer) ;;
            PostgreSQL|MySQL)
              if [ "$ALLOW_MANAGED_DATABASE_PROVIDERS" != "true" ]; then
                echo "::error::Set AZURE_ALLOW_MANAGED_DATABASE_PROVIDERS=true to keep the managed-provider cost opt-in enabled."
                exit 1
              fi
              if [ "$DATABASE_ADMIN_PASSWORD_PRESENT" != "true" ]; then
                echo "::error::Configure the AZURE_DATABASE_ADMIN_PASSWORD secret in the selected GitHub Environment."
                exit 1
              fi
              ;;
            SQLite) ;;
            *)
              echo "::error::Unsupported AZURE_DATABASE_PROVIDER."
              exit 1
              ;;
          esac

      - name: 🔑 Request Azure OIDC token
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC is unavailable for this job.}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC is unavailable for this job.}"
          OIDC_RESPONSE="$(curl --fail --silent --show-error \
            --header "Authorization: ******" \
            --get \
            --data-urlencode "audience=api://AzureADTokenExchange" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          ARM_OIDC_TOKEN="$(jq -er '.value | select(type == "string" and length > 0)' <<< "$OIDC_RESPONSE")"
          echo "::add-mask::$ARM_OIDC_TOKEN"
          printf 'ARM_OIDC_TOKEN=%s\n' "$ARM_OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: 📦 Download the reviewed plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/terraform-plan

      - name: 🔒 Verify and apply the exact reviewed plan
        shell: bash
        env:
          TF_VAR_database_admin_password_wo: ${{ secrets.AZURE_DATABASE_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            testing)
              TERRAFORM_ROOT="infra/terraform/environments/testing"
              STATE_KEY="testing.tfstate"
              ;;
            production)
              TERRAFORM_ROOT="infra/terraform/environments/production"
              STATE_KEY="production.tfstate"
              ;;
            *)
              echo "::error::Unsupported target environment."
              exit 1
              ;;
          esac

          PLAN_PATH="$RUNNER_TEMP/terraform-plan/${TARGET_ENVIRONMENT}.tfplan"
          ACTUAL_PLAN_SHA256="$(sha256sum "$PLAN_PATH" | cut -d ' ' -f 1)"
          if [ "$ACTUAL_PLAN_SHA256" != "$EXPECTED_PLAN_SHA256" ]; then
            echo "::error::The downloaded plan does not match the plan reviewed in the preceding job."
            exit 1
          fi

          backend_config=(
            "-backend-config=resource_group_name=${AZURE_STATE_RESOURCE_GROUP_NAME}"
            "-backend-config=storage_account_name=${AZURE_STATE_STORAGE_ACCOUNT_NAME}"
            "-backend-config=container_name=${AZURE_STATE_CONTAINER_NAME}"
            "-backend-config=key=${STATE_KEY}"
            "-backend-config=subscription_id=${ARM_SUBSCRIPTION_ID}"
            "-backend-config=tenant_id=${ARM_TENANT_ID}"
            "-backend-config=client_id=${ARM_CLIENT_ID}"
            "-backend-config=use_azuread_auth=true"
            "-backend-config=use_oidc=true"
          )
          terraform "-chdir=$TERRAFORM_ROOT" init -input=false "${backend_config[@]}"
          terraform "-chdir=$TERRAFORM_ROOT" apply -input=false -auto-approve -lock-timeout=5m "$PLAN_PATH"
