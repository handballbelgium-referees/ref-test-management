name: 🚀 Opt-in Azure Container Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target_environment:
        required: true
        type: string

concurrency:
  group: azure-container-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/container-build.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      target_environment: ${{ inputs.target_environment }}
    permissions:
      contents: read

  deploy:
    name: Deploy to Azure Container Apps (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 75
    environment:
      name: ${{ inputs.target_environment }}
      url: ${{ steps.deploy.outputs.api-url }}
    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      AZURE_UNIQUE_SUFFIX: ${{ vars.AZURE_UNIQUE_SUFFIX }}
      AZURE_DEPLOYMENT_MODE: ${{ vars.AZURE_DEPLOYMENT_MODE }}

    steps:
      - name: ⬇️ Download tagged container archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ github.workspace }}/release-artifact

      - name: 🔒 Verify tagged build provenance and archives
        env:
          VALIDATED_SHA: ${{ needs.build.outputs.validated-sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          API_IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.api-image-archive-sha256 }}
          WORKER_IMAGE_ARCHIVE_SHA256: ${{ needs.build.outputs.worker-image-archive-sha256 }}
          CONTAINER_ARCHIVES_SHA256: ${{ needs.build.outputs.container-archives-sha256 }}
          NODE_VERSION: ${{ needs.build.outputs.node-version }}
          NPM_VERSION: ${{ needs.build.outputs.npm-version }}
          DOTNET_SDK_VERSION: ${{ needs.build.outputs.dotnet-sdk-version }}
          DOTNET_SDKS: ${{ needs.build.outputs.dotnet-sdks }}
          DOTNET_RUNTIMES: ${{ needs.build.outputs.dotnet-runtimes }}
          RUNNER_OS_NAME: ${{ needs.build.outputs.runner-os }}
          RUNNER_ARCH: ${{ needs.build.outputs.runner-arch }}
          RUNNER_IMAGE_OS: ${{ needs.build.outputs.runner-image-os }}
          RUNNER_IMAGE_VERSION: ${{ needs.build.outputs.runner-image-version }}
        run: |
          set -euo pipefail
          EXPECTED_PROVENANCE="$(printf 'validated-sha=%s\nrelease-tag=%s\ntarget-environment=%s\nimage-tag=%s\nnode-version=%s\nnpm-version=%s\ndotnet-sdk-version=%s\ndotnet-sdks=%s\ndotnet-runtimes=%s\nrunner-os=%s\nrunner-arch=%s\nrunner-image-os=%s\nrunner-image-version=%s' \
            "$VALIDATED_SHA" "$RELEASE_TAG" "$TARGET_ENVIRONMENT" "$IMAGE_TAG" \
            "$NODE_VERSION" "$NPM_VERSION" "$DOTNET_SDK_VERSION" "$DOTNET_SDKS" "$DOTNET_RUNTIMES" \
            "$RUNNER_OS_NAME" "$RUNNER_ARCH" "$RUNNER_IMAGE_OS" "$RUNNER_IMAGE_VERSION")"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"api-image-archive-sha256=${API_IMAGE_ARCHIVE_SHA256}"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"worker-image-archive-sha256=${WORKER_IMAGE_ARCHIVE_SHA256}"
          EXPECTED_PROVENANCE="${EXPECTED_PROVENANCE}"$'\n'"container-archives-sha256=${CONTAINER_ARCHIVES_SHA256}"
          ACTUAL_PROVENANCE="$(cat "$GITHUB_WORKSPACE/release-artifact/provenance.txt")"
          if [ "$ACTUAL_PROVENANCE" != "$EXPECTED_PROVENANCE" ]; then
            echo "::error::Container artifact provenance does not match the selected release."
            exit 1
          fi

          IMAGE_DIRECTORY="$GITHUB_WORKSPACE/release-artifact/images"
          ACTUAL_API_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-api.tar.gz" | cut -d ' ' -f 1)"
          ACTUAL_WORKER_IMAGE_ARCHIVE_SHA256="$(sha256sum "$IMAGE_DIRECTORY/ref-test-management-worker.tar.gz" | cut -d ' ' -f 1)"
          ACTUAL_CONTAINER_ARCHIVES_SHA256="$(cd "$IMAGE_DIRECTORY" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
          if [ "$API_IMAGE_ARCHIVE_SHA256" != "$ACTUAL_API_IMAGE_ARCHIVE_SHA256" ] || \
             [ "$WORKER_IMAGE_ARCHIVE_SHA256" != "$ACTUAL_WORKER_IMAGE_ARCHIVE_SHA256" ] || \
             [ "$CONTAINER_ARCHIVES_SHA256" != "$ACTUAL_CONTAINER_ARCHIVES_SHA256" ]; then
            echo "::error::Container archive digests do not match the selected tagged build."
            exit 1
          fi

      - name: 🔑 Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🐳 Push immutable images and run migration
        id: prepare-deployment
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          : "${AZURE_ACR_NAME:?Set AZURE_ACR_NAME in the selected Azure Environment.}"
          : "${AZURE_RESOURCE_GROUP_NAME:?Set AZURE_RESOURCE_GROUP_NAME in the selected Azure Environment.}"
          : "${AZURE_NAME_PREFIX:?Set AZURE_NAME_PREFIX in the selected Azure Environment.}"
          : "${AZURE_UNIQUE_SUFFIX:?Set AZURE_UNIQUE_SUFFIX in the selected Azure Environment.}"
          : "${AZURE_DEPLOYMENT_MODE:?Set AZURE_DEPLOYMENT_MODE in the selected Azure Environment.}"

          case "$AZURE_DEPLOYMENT_MODE" in
            single|split) ;;
            *)
              echo "::error::AZURE_DEPLOYMENT_MODE must be single or split."
              exit 1
              ;;
          esac

          BASE_NAME="${AZURE_NAME_PREFIX}-${AZURE_UNIQUE_SUFFIX}"
          MIGRATION_JOB_NAME="${BASE_NAME}-migration"
          API_LOCAL_IMAGE="ref-test-management-api:${IMAGE_TAG}"
          WORKER_LOCAL_IMAGE="ref-test-management-worker:${IMAGE_TAG}"
          docker load --input "$GITHUB_WORKSPACE/release-artifact/images/ref-test-management-api.tar.gz"
          docker load --input "$GITHUB_WORKSPACE/release-artifact/images/ref-test-management-worker.tar.gz"
          docker image inspect "$API_LOCAL_IMAGE" >/dev/null
          docker image inspect "$WORKER_LOCAL_IMAGE" >/dev/null

          az acr login --name "$AZURE_ACR_NAME"
          ACR_LOGIN_SERVER="$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)"
          if [ -z "$ACR_LOGIN_SERVER" ] || [ "$ACR_LOGIN_SERVER" = "None" ]; then
            echo "::error::Azure Container Registry login server could not be resolved."
            exit 1
          fi

          API_TAGGED_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-api:${IMAGE_TAG}"
          WORKER_TAGGED_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-worker:${IMAGE_TAG}"
          docker tag "$API_LOCAL_IMAGE" "$API_TAGGED_IMAGE"
          docker tag "$WORKER_LOCAL_IMAGE" "$WORKER_TAGGED_IMAGE"
          docker push "$API_TAGGED_IMAGE"
          docker push "$WORKER_TAGGED_IMAGE"

          API_DIGEST="$(az acr repository show --name "$AZURE_ACR_NAME" \
            --image "ref-test-management-api:${IMAGE_TAG}" --query digest --output tsv)"
          WORKER_DIGEST="$(az acr repository show --name "$AZURE_ACR_NAME" \
            --image "ref-test-management-worker:${IMAGE_TAG}" --query digest --output tsv)"
          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ACR did not return valid immutable image digests."
            exit 1
          fi

          API_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-api@${API_DIGEST}"
          WORKER_IMAGE="${ACR_LOGIN_SERVER}/ref-test-management-worker@${WORKER_DIGEST}"
          az containerapp job update \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --image "$WORKER_IMAGE" \
            --output none

          PREVIOUS_EXECUTION="$(az containerapp job execution list \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query 'sort_by(@, &properties.startTime)[-1].name' \
            --output tsv || true)"
          az containerapp job start \
            --name "$MIGRATION_JOB_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --output none

          EXECUTION_NAME=""
          for attempt in {1..30}; do
            LATEST_EXECUTION="$(az containerapp job execution list \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --query 'sort_by(@, &properties.startTime)[-1].name' \
              --output tsv)"
            if [ -n "$LATEST_EXECUTION" ] && \
               [ "$LATEST_EXECUTION" != "None" ] && \
               [ "$LATEST_EXECUTION" != "$PREVIOUS_EXECUTION" ]; then
              EXECUTION_NAME="$LATEST_EXECUTION"
              break
            fi
            sleep 2
          done
          if [ -z "$EXECUTION_NAME" ]; then
            echo "::error::Azure did not report the migration job execution started by this deployment."
            exit 1
          fi

          MIGRATION_SUCCEEDED=false
          for attempt in {1..390}; do
            STATUS="$(az containerapp job execution show \
              --name "$MIGRATION_JOB_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --job-execution-name "$EXECUTION_NAME" \
              --query properties.status \
              --output tsv)"
            case "$STATUS" in
              Succeeded)
                MIGRATION_SUCCEEDED=true
                break
                ;;
              Failed|Stopped)
                echo "::error::Migration execution ended with status '$STATUS'."
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          if [ "$MIGRATION_SUCCEEDED" != true ]; then
            echo "::error::Migration execution did not complete within the 65-minute deployment timeout."
            exit 1
          fi

          {
            printf 'api-image=%s\n' "$API_IMAGE"
            printf 'worker-image=%s\n' "$WORKER_IMAGE"
          } >> "$GITHUB_OUTPUT"
          {
            printf '### %s Azure image digests\n\n' "$TARGET_ENVIRONMENT"
            printf '* API: `%s`\n' "$API_IMAGE"
            printf '* Worker: `%s`\n' "$WORKER_IMAGE"
            printf '* Migration execution: `%s`\n' "$EXECUTION_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚀 Deploy immutable Container Apps revisions
        id: deploy
        env:
          API_IMAGE: ${{ steps.prepare-deployment.outputs.api-image }}
          WORKER_IMAGE: ${{ steps.prepare-deployment.outputs.worker-image }}
        run: |
          set -euo pipefail
          BASE_NAME="${AZURE_NAME_PREFIX}-${AZURE_UNIQUE_SUFFIX}"
          API_APP_NAME="${BASE_NAME}-api"
          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --image "$API_IMAGE" \
            --output none

          if [ "$AZURE_DEPLOYMENT_MODE" = "split" ]; then
            WORKER_APP_NAME="${BASE_NAME}-worker"
            az containerapp update \
              --name "$WORKER_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
              --image "$WORKER_IMAGE" \
              --output none
          fi

          API_FQDN="$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          if [ -z "$API_FQDN" ] || [ "$API_FQDN" = "None" ]; then
            echo "::error::The deployed API Container App did not return an ingress hostname."
            exit 1
          fi
          echo "api-url=https://$API_FQDN" >> "$GITHUB_OUTPUT"

      - name: 🎉 Container deployment complete
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "✅ Successfully deployed $RELEASE_TAG to Azure Container Apps."
          echo "🌐 URL: ${{ steps.deploy.outputs.api-url }}"
