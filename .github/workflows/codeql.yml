name: 🔍 CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, rather than on every push. CodeQL's C# analysis has to build the whole solution, so
    # running it per-push would duplicate the PR run for no new signal. The schedule exists to
    # catch newly published queries against code that has not changed.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: 🔍 Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest

    permissions:
      # Required to upload results to the Security tab.
      security-events: write
      contents: read
      # Required for the CodeQL action to read workflow-run metadata used in status reporting.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: javascript-typescript
            # The Angular app needs no build for CodeQL: its queries run over the TypeScript
            # sources, and bundling would only hide them behind generated output.
            build-mode: none

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ⚡ Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401

      - name: 🛠 Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-precision queries on top of the default suite. Worth it
          # here: this application handles participants' personal data, so a false positive costs
          # a review while a missed injection costs a breach notification.
          queries: security-extended

      - name: 🔬 Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: /language:${{ matrix.language }}
