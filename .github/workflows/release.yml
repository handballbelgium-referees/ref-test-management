name: Release CI/CD (Stable Releases)

on:
  push:
    branches: [release]

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

jobs:
  release:
    name: 🚀 Create Stable Release
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new_release_published }}
      new-release-version: ${{ steps.semantic-release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏷 Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG_BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          npx semantic-release
          LATEST_TAG_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$LATEST_TAG_BEFORE" != "$LATEST_TAG_AFTER" ] && [ -n "$LATEST_TAG_AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=${LATEST_TAG_AFTER#v}" >> $GITHUB_OUTPUT
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: 🛠 Build Application
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.new-release-version }}

      - name: 🏷 Set version
        run: |
          echo "APP_VERSION=${{ needs.release.outputs.new-release-version }}" >> $GITHUB_ENV
          echo "Building version ${{ needs.release.outputs.new-release-version }}"

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📝 Inject version into Angular
        run: |
          sed -i "s/__APP_VERSION__/${APP_VERSION}/g" RefTestManagement.Ui/src/version.ts

      - name: 📦 Install Angular dependencies
        working-directory: ./RefTestManagement.Ui
        run: npm ci

      - name: 🏗 Build Angular application
        working-directory: ./RefTestManagement.Ui
        run: npm run build -- --configuration production

      - name: 🗂 Prepare wwwroot folder
        run: mkdir -p RefTestManagement.Api/wwwroot

      - name: 📤 Copy Angular build to .NET wwwroot
        run: |
          cp -r RefTestManagement.Ui/dist/RefTestManagement.Ui/browser/* RefTestManagement.Api/wwwroot/

      - name: ⚡ Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 🔄 Restore .NET dependencies
        run: dotnet restore RefTestManagement.sln

      - name: 🏗 Build .NET application
        run: dotnet build RefTestManagement.sln --configuration Release --no-restore

      - name: 📦 Publish .NET application
        run: |
          dotnet publish RefTestManagement.Api/RefTestManagement.Api.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: ⬆️ Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-production
          path: ./publish
          retention-days: 7

  sync-to-main:
    name: 🔄 Sync release to main
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Sync release tag to main
        run: |
          git fetch origin main
          git checkout main
          git merge origin/release --strategy-option theirs --no-ff -m "chore(release): sync v${{ needs.release.outputs.new-release-version }} to main [skip ci]"
          git push origin main

  deploy-production:
    name: 🚀 Deploy to Production (${{ needs.release.outputs.new-release-version }})
    runs-on: ubuntu-latest
    needs: [release, build]
    if: needs.release.outputs.new-release-published == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: ⬇️ Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-production
          path: ${{ github.workspace }}/publish

      - name: 🔑 Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🚀 Deploy to Azure Web App (Production)
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_PRODUCTION_NAME }}
          package: ${{ github.workspace }}/publish
          clean: true

      - name: 🎉 Deployment complete
        run: |
          echo "✅ Successfully deployed version ${{ needs.release.outputs.new-release-version }} to production"
          echo "🌐 URL: ${{ steps.deploy.outputs.webapp-url }}"
