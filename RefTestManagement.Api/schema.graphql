union UpdateRefTestConfigurationError = RefTestNotFoundError | InvalidRefTestStatusError

union UpdateRefTestDetailsError = RefTestNotFoundError | InvalidRefTestStatusError

union UpdateRefTestNotificationSettingsError = RefTestNotFoundError

