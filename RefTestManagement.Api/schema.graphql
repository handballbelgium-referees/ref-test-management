schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

interface Error {
  message: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

"IHF RefTest answer"
type Answer {
  "Answer id"
  id: String!
  "Answer number"
  number: String @authorize
  "Translations of the answer phrase"
  phrase: JSON @cacheControl(maxAge: 0) @cost(weight: "10")
  "Answer is correct"
  isCorrect: Boolean! @authorize
}

type CompleteRefTestPayload {
  refTest: RefTest
  errors: [CompleteRefTestError!]
}

type CreateRefTestsError {
  user: User!
  errorMessage: String!
}

type CreateRefTestsPayload {
  createRefTestsResult: CreateRefTestsResult
}

type CreateRefTestsResult {
  totalRequested: Int!
  successfullyCreated: Int!
  failed: Int!
  createdRefTests: [RefTest!]!
  errors: [CreateRefTestsError!]!
}

type DeleteRefTestError {
  refTestId: UUID!
  errorMessage: String!
}

type DeleteRefTestsPayload {
  deleteRefTestsResult: DeleteRefTestsResult
}

type DeleteRefTestsResult {
  totalRequested: Int!
  successfullyDeleted: Int!
  failed: Int!
  deletedRefTests: [RefTest!]!
  errors: [DeleteRefTestError!]!
}

type ExtendRefTestTimePayload {
  refTest: RefTest
  errors: [ExtendRefTestTimeError!]
}

type InvalidRefTestStatusError implements Error {
  message: String!
}

type Mutation {
  createRefTests(input: CreateRefTestsInput!): CreateRefTestsPayload! @authorize @cost(weight: "10")
  deleteRefTests(input: DeleteRefTestsInput!): DeleteRefTestsPayload! @authorize @cost(weight: "10")
  sendInvitations(input: SendInvitationsInput!): SendInvitationsPayload! @authorize @cost(weight: "10")
  sendResults(input: SendResultsInput!): SendResultsPayload! @authorize @cost(weight: "10")
  sendReport(input: SendReportInput!): SendReportPayload! @authorize @cost(weight: "10")
  startRefTest(input: StartRefTestInput!): StartRefTestPayload! @cost(weight: "10")
  saveRefTestProgress(input: SaveRefTestProgressInput!): SaveRefTestProgressPayload! @cost(weight: "10")
  completeRefTest(input: CompleteRefTestInput!): CompleteRefTestPayload! @cost(weight: "10")
  resetRefTests(input: ResetRefTestsInput!): ResetRefTestsPayload! @authorize @cost(weight: "10")
  reviveRefTests(input: ReviveRefTestsInput!): ReviveRefTestsPayload! @authorize @cost(weight: "10")
  updateRefTestDetails(input: UpdateRefTestDetailsInput!): UpdateRefTestDetailsPayload! @authorize @cost(weight: "10")
  updateRefTestConfiguration(input: UpdateRefTestConfigurationInput!): UpdateRefTestConfigurationPayload! @authorize @cost(weight: "10")
  extendRefTestTime(input: ExtendRefTestTimeInput!): ExtendRefTestTimePayload! @authorize @cost(weight: "10")
  updateRefTestNotificationSettings(input: UpdateRefTestNotificationSettingsInput!): UpdateRefTestNotificationSettingsPayload! @authorize @cost(weight: "10")
  regenerateRefTestToken(input: RegenerateRefTestTokenInput!): RegenerateRefTestTokenPayload! @authorize @cost(weight: "10")
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type Query {
  "Fetches an object given its ID."
  node("ID of the object." id: ID!): Node @cost(weight: "10")
  "Lookup nodes by a list of IDs."
  nodes("The list of node IDs." ids: [ID!]!): [Node]! @cost(weight: "10")
  refTestByToken(token: String!): RefTestByTokenResult! @cacheControl(maxAge: 0) @cost(weight: "10")
  refTestTitles("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: RefTestTitleFilterInput @cost(weight: "10") order: [RefTestTitleSortInput!] @cost(weight: "10")): RefTestTitlesConnection @authorize @listSize(assumedSize: 100, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 20, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cacheControl(maxAge: 0) @cost(weight: "10")
  refTests("Returns the first _n_ elements from the list." first: Int "Returns the elements in the list that come after the specified cursor." after: String "Returns the last _n_ elements from the list." last: Int "Returns the elements in the list that come before the specified cursor." before: String where: RefTestFilterInput @cost(weight: "10") order: [RefTestSortInput!] @cost(weight: "10")): RefTestsConnection @authorize @listSize(assumedSize: 100, slicingArguments: [ "first", "last" ], slicingArgumentDefaultValue: 20, sizedFields: [ "edges", "nodes" ], requireOneSlicingArgument: false) @cacheControl(maxAge: 0) @cost(weight: "10")
  refTest(id: ID!): RefTest @authorize @cacheControl(maxAge: 0) @cost(weight: "10")
  searchQuestionsByNumber(number: String): [Question!]! @authorize @cacheControl(maxAge: 0) @cost(weight: "10")
  questionsByNumber(numbers: [String!]!): [Question!]! @authorize @cacheControl(maxAge: 0) @cost(weight: "10")
  enabledLanguages: [String!]! @cacheControl(maxAge: 3600) @cost(weight: "10")
  scoreConfiguration: ScoreConfiguration! @cacheControl(maxAge: 3600) @cost(weight: "10")
  resultsEmailDelayMinutes: Int! @cacheControl(maxAge: 3600) @cost(weight: "10")
}

"IHF RefTest question"
type Question {
  "Question id"
  id: String!
  "Question number"
  number: String! @authorize
  "Translations of the question phrase"
  phrase: JSON @cacheControl(maxAge: 0) @cost(weight: "10")
  "Answers for this RefTest question"
  answers: [Answer!]!
}

"RefTest"
type RefTest implements Node {
  "The RefTest id"
  id: ID!
  "Title of the RefTest"
  title: RefTestTitle
  "First name of the user who started the RefTest"
  firstName: String! @authorize
  "Last name of the user who started the RefTest"
  lastName: String! @authorize
  "Name of the user who started the RefTest (e.g., )"
  name: String!
  "Email of the user who started the RefTest"
  email: String!
  "Indication of invitation was sent"
  invitationSent: Boolean! @authorize
  "Indication of whether invitations are sent automatically"
  sendInvitationsAutomatically: Boolean! @authorize
  "Maximum time in minutes for the RefTest"
  maxTimeInMinutes: Int!
  "Number of questions in the RefTest"
  numberOfQuestions: Int!
  "Creation date and time of the RefTest"
  createdAt: DateTime! @authorize
  "Start date and time of the RefTest"
  startedAt: DateTime
  "Completion date and time of the RefTest"
  completedAt: DateTime @authorize
  "Percentage of correct answers"
  percentage: Float
  "Score based on fully correct questions"
  questionScore: Int
  "Score based on individual answers"
  answerScore: Int
  "Total possible question score"
  questionTotal: Int!
  "Total possible answer score"
  answerTotal: Int
  "List of question IDs that were answered incorrectly"
  wrongQuestionIds: [String!]!
  "List of answer IDs that were answered incorrectly"
  wrongAnswerIds: [String!]!
  "Indication of results were sent"
  resultsSent: Boolean! @authorize
  "Indication of whether results are sent automatically"
  sendResultsAutomatically: Boolean! @authorize
  "Status of the RefTest (e.g., InProgress, Completed, Expired). Expired tests are automatically processed by a background service."
  status: RefTestStatus! @authorize
  "Index of the current question"
  currentQuestionIndex: Int
  "List of selected answer IDs"
  selectedAnswerIds: [String!]!
  "Questions for this RefTest"
  questions(includeNumber: Boolean = false includeIsCorrect: Boolean = false randomAnswerOrder: Boolean = true): [Question] @cacheControl(maxAge: 0) @cost(weight: "10")
}

type RefTestExpiredError implements Error {
  message: String!
}

type RefTestNotFoundError implements Error {
  message: String!
}

type RefTestTimeExtended {
  id: ID!
  newMaxTimeInMinutes: Int!
  additionalMinutes: Int!
  extendedAt: DateTime!
}

"The title of the RefTest"
type RefTestTitle implements Node {
  "The RefTest title id"
  id: ID!
  "RefTest title value"
  value: String!
}

"A connection to a list of items."
type RefTestTitlesConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [RefTestTitlesEdge!]
  "A flattened list of the nodes."
  nodes: [RefTestTitle!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type RefTestTitlesEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: RefTestTitle!
}

"A connection to a list of items."
type RefTestsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [RefTestsEdge!]
  "A flattened list of the nodes."
  nodes: [RefTest!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type RefTestsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: RefTest!
}

type RegenerateRefTestTokenPayload {
  refTest: RefTest
