mutation StartRefTest($input: StartRefTestInput!) {
  startRefTest(input: $input) {
    participantRefTest {
      id
      startedAt
      maxTimeInMinutes
      currentQuestionIndex
      selectedAnswerIds
      questions {
        id
        phrase
        answers {
          id
          phrase
        }
      }
    }
    errors {
      __typename
      ... on RefTestNotFoundError {
        message
      }
      ... on RefTestExpiredError {
        message
      }
      ... on InvalidRefTestStatusError {
        message
      }
    }
  }
}
