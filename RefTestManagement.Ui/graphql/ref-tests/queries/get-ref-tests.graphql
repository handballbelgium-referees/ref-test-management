query GetRefTests(
  $first: Int
  $after: String
  $where: RefTestFilterInput
  $order: [RefTestSortInput!]
) {
  refTests(first: $first, after: $after, where: $where, order: $order) {
    edges {
      cursor
      node {
        id
        title {
          id
          value
        }
        name
        email
        invitationSent
        resultsSent
        sendInvitationsAutomatically
        sendResultsAutomatically
        status
        numberOfQuestions
        maxTimeInMinutes
        scheduledAt
        startedAt
        completedAt
        questionScore
        answerScore
        questionTotal
        answerTotal
        percentage
        rejectionReason
        isAnonymized
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
