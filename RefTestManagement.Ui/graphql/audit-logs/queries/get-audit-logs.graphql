query GetAuditLogs(
  $first: Int
  $after: String
  $where: AuditLogDtoFilterInput
  $order: [AuditLogDtoSortInput!]
) {
  auditLogs(first: $first, after: $after, where: $where, order: $order) {
    edges {
      cursor
      node {
        seqId
        id
        streamId
        version
        data
        type
        timestamp
        actorName
        actorEmail
        headers
        nodeId
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}
