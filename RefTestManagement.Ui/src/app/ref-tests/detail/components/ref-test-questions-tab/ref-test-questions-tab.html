<div class="p-6 sm:p-8">
  @if (refTest(); as test) {
    @if (!hasQuestions()) {
      <app-empty-questions-state />
    } @else {
      <div class="space-y-6">
        @for (question of test.questions ?? []; track question?.id; let questionIdx = $index) {
          <app-question-card
            [question]="question"
            [questionIndex]="questionIdx"
            [currentLanguage]="currentLanguage()"
            [selectedAnswerIds]="selectedAnswerIdsSet()"
          />
        }
      </div>

      <!-- Summary -->
      <div class="mt-6">
        <app-answers-summary
          [answeredQuestionsCount]="answeredQuestionsCount()"
          [totalQuestions]="test.numberOfQuestions"
        />
      </div>
    }
  }
</div>
