<div class="p-6 sm:p-8">
  @if (refTest(); as test) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Participant Info -->
      <app-details-card
        [name]="test.name"
        [email]="test.email"
        [status]="test.status"
        (edit)="operationManager.updateRefTestDetailsDialog.initiate(test)"
        (reset)="operationManager.resetDialog.initiate()"
        (revive)="operationManager.reviveDialog.initiate()"
      />

      <!-- Test Info -->
      <app-test-info-card
        [title]="test.title ?? undefined"
        [numberOfQuestions]="test.numberOfQuestions"
        [maxTimeInMinutes]="test.maxTimeInMinutes"
        [status]="test.status"
        (edit)="operationManager.updateRefTestConfigurationDialog.initiate(test)"
        (regenerateToken)="operationManager.regenerateRefTestTokenDialog.initiate()"
      />

      <!-- Status Info -->
      <app-status-info-card
        [invitationSent]="test.invitationSent"
        [resultsSent]="test.resultsSent"
        [sendInvitationsAutomatically]="test.sendInvitationsAutomatically"
        [sendResultsAutomatically]="test.sendResultsAutomatically"
        [status]="test.status"
        (edit)="operationManager.updateRefTestNotificationSettingsDialog.initiate(test)"
      />

      <!-- Timeline -->
      <app-timeline-card
        [startedAt]="test.startedAt ?? undefined"
        [completedAt]="test.completedAt ?? undefined"
        [status]="test.status"
        (extendTime)="operationManager.extendRefTestTimeDialog.initiate(test)"
      />
    </div>

    <!-- Scores Section -->
    @if (hasScore()) {
      <div class="mt-6">
        <app-scores-card
          [percentage]="test.percentage ?? 0"
          [isPassed]="isPassed()"
          [questionScore]="test.questionScore ?? 0"
          [questionTotal]="test.questionTotal"
          [answerScore]="test.answerScore ?? 0"
          [answerTotal]="test.answerTotal ?? 0"
        />
      </div>
    }
  }

  <!-- Update Details Dialog -->
  <app-update-details-dialog
    [loading]="operationManager.updateRefTestDetailsDialog.loading()"
    [show]="operationManager.updateRefTestDetailsDialog.show()"
    [initialData]="operationManager.updateRefTestDetailsDialog.initialData()"
    (confirm)="confirmUpdateParticipantDetails($event.input, $event.bannerManager)"
    (cancel)="operationManager.updateRefTestDetailsDialog.cancel()"
  />

  <!-- Update Configuration Dialog -->
  <app-update-configuration-dialog
    [loading]="operationManager.updateRefTestConfigurationDialog.loading()"
    [show]="operationManager.updateRefTestConfigurationDialog.show()"
    [initialData]="operationManager.updateRefTestConfigurationDialog.initialData()"
    (confirm)="confirmUpdateConfiguration($event.input, $event.bannerManager)"
    (cancel)="operationManager.updateRefTestConfigurationDialog.cancel()"
  />

  <!-- Update Notification Settings Dialog -->
  <app-update-notification-settings-dialog
    [loading]="operationManager.updateRefTestNotificationSettingsDialog.loading()"
    [show]="operationManager.updateRefTestNotificationSettingsDialog.show()"
    [initialData]="operationManager.updateRefTestNotificationSettingsDialog.initialData()"
    (confirm)="confirmUpdateNotificationSettings($event.input, $event.bannerManager)"
    (cancel)="operationManager.updateRefTestNotificationSettingsDialog.cancel()"
  />

  <!-- Extend Time Dialog -->
  <app-extend-time-dialog
    [loading]="operationManager.extendRefTestTimeDialog.loading()"
    [show]="operationManager.extendRefTestTimeDialog.show()"
    [initialData]="operationManager.extendRefTestTimeDialog.initialData()"
    (confirm)="extendTime($event.input, $event.bannerManager)"
    (cancel)="operationManager.extendRefTestTimeDialog.cancel()"
  />

  <!-- Regenerate Token Dialog -->
  <app-regenerate-token-dialog
    [loading]="operationManager.regenerateRefTestTokenDialog.loading()"
    [show]="operationManager.regenerateRefTestTokenDialog.show()"
    (confirm)="confirmRegenerateToken($event)"
    (cancel)="operationManager.regenerateRefTestTokenDialog.cancel()"
  />

  <!-- Reset Ref Test Dialog -->
  <app-reset-ref-test-dialog
    [show]="operationManager.resetDialog.show()"
    [loading]="operationManager.resetDialog.loading()"
    (confirm)="confirmReset($event.options, $event.bannerManager)"
    (cancel)="operationManager.resetDialog.cancel()"
  />

  <!-- Revive Ref Test Dialog -->
  <app-revive-ref-test-dialog
    [show]="operationManager.reviveDialog.show()"
    [loading]="operationManager.reviveDialog.loading()"
    (confirm)="confirmRevive()"
    (cancel)="operationManager.reviveDialog.cancel()"
  />
</div>
