<div class="p-6 sm:p-8">
  @if (refTest(); as test) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Participant Info -->
      <app-participant-info-card
        [name]="test.name"
        [email]="test.email"
        [status]="test.status"
        (edit)="onEditParticipant()"
      />

      <!-- Test Info -->
      <app-test-info-card
        [title]="test.title ?? undefined"
        [numberOfQuestions]="test.numberOfQuestions"
        [maxTimeInMinutes]="test.maxTimeInMinutes"
        [status]="test.status"
        (edit)="onEditConfiguration()"
      />

      <!-- Status Info -->
      <app-status-info-card
        [invitationSent]="test.invitationSent"
        [resultsSent]="test.resultsSent"
        [sendInvitationsAutomatically]="test.sendInvitationsAutomatically"
        [sendResultsAutomatically]="test.sendResultsAutomatically"
        [status]="test.status"
        (edit)="onEditNotificationSettings()"
      />

      <!-- Timeline -->
      <app-timeline-card
        [startedAt]="test.startedAt ?? undefined"
        [completedAt]="test.completedAt ?? undefined"
      />
    </div>

    <!-- Scores Section -->
    @if (hasScore()) {
      <div class="mt-6">
        <app-scores-card
          [percentage]="test.percentage ?? 0"
          [isPassed]="isPassed()"
          [questionScore]="test.questionScore ?? 0"
          [questionTotal]="test.questionTotal"
          [answerScore]="test.answerScore ?? 0"
          [answerTotal]="test.answerTotal ?? 0"
        />
      </div>
    }
  }

  <!-- Edit Participant Dialog -->
  <app-edit-participant-dialog
    [show]="showEditDialog()"
    (closeDialog)="onEditDialogClose()"
    (cancel)="onEditDialogClose()"
  />

  <!-- Edit Configuration Dialog -->
  <app-edit-configuration-dialog
    [show]="showEditConfigDialog()"
    (closeDialog)="onEditConfigDialogClose()"
    (cancel)="onEditConfigDialogClose()"
  />

  <!-- Edit Notification Settings Dialog -->
  <app-edit-notification-settings-dialog
    [show]="showEditNotificationDialog()"
    (closeDialog)="onEditNotificationDialogClose()"
    (cancel)="onEditNotificationDialogClose()"
  />
</div>
