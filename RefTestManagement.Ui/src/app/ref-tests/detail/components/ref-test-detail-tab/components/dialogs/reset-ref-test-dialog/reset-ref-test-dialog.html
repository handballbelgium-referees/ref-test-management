@if (show()) {
  <div
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
    (click)="cancel.emit()"
  >
    <div
      class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-labelledby="dialog-title"
      aria-modal="true"
    >
      <!-- Header -->
      <div class="px-6 py-4 border-b border-neutral-200">
        <h2 id="dialog-title" class="text-xl font-bold text-neutral-900">
          {{ 'ref_tests.detail.reset.title' | translate }}
        </h2>
        <p class="text-sm text-neutral-600 mt-1">
          {{ 'ref_tests.detail.reset.subtitle' | translate }}
        </p>
      </div>

      <!-- Content -->
      <div class="px-6 py-6 overflow-y-auto flex-1 scrollbar-hide">
        <div class="space-y-6">
          @if (error()) {
            <div class="bg-red-50 border border-red-200 rounded-lg p-4">
              <p class="text-sm text-red-800">{{ error() }}</p>
            </div>
          }

          <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
            <div class="flex items-start gap-3">
              <svg
                class="w-6 h-6 text-yellow-600 shrink-0 mt-0.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                />
              </svg>
              <div>
                <p class="text-sm font-medium text-yellow-800">
                  {{ 'ref_tests.detail.reset.warning_title' | translate }}
                </p>
                <p class="text-sm text-yellow-700 mt-1">
                  {{ 'ref_tests.detail.reset.warning_message' | translate }}
                </p>
              </div>
            </div>
          </div>

          <!-- Reset Type -->
          <div class="space-y-3">
            <label class="block text-sm font-medium text-neutral-700">
              {{ 'ref_tests.detail.reset.reset_type_label' | translate }}
            </label>

            <div class="flex items-start gap-3">
              <input
                id="resetTypeSoft"
                type="radio"
                [value]="RefTestResetType.Soft"
                [formField]="resetOptionsForm.resetType"
                class="w-4 h-4 text-primary-600 border-neutral-300 focus:ring-primary-500 mt-0.5"
              />
              <label for="resetTypeSoft" class="text-sm text-neutral-700 flex-1">
                <div class="font-medium mb-0.5">
                  {{ 'ref_tests.detail.reset.soft_reset_label' | translate }}
                </div>
                <p class="text-xs text-neutral-500">
                  {{ 'ref_tests.detail.reset.soft_reset_description' | translate }}
                </p>
              </label>
            </div>

            <div class="flex items-start gap-3">
              <input
                id="resetTypeHard"
                type="radio"
                [value]="RefTestResetType.Hard"
                [formField]="resetOptionsForm.resetType"
                class="w-4 h-4 text-primary-600 border-neutral-300 focus:ring-primary-500 mt-0.5"
              />
              <label for="resetTypeHard" class="text-sm text-neutral-700 flex-1">
                <div class="font-medium mb-0.5">
                  {{ 'ref_tests.detail.reset.hard_reset_label' | translate }}
                </div>
                <p class="text-xs text-neutral-500">
                  {{ 'ref_tests.detail.reset.hard_reset_description' | translate }}
                </p>
              </label>
            </div>
          </div>

          <!-- Regenerate Token Option -->
          <div class="flex items-start gap-3">
            <input
              id="regenerateToken"
              type="checkbox"
              [formField]="resetOptionsForm.regenerateToken"
              class="w-4 h-4 text-primary-600 border-2 border-neutral-300 rounded focus:ring-primary-500 mt-0.5"
            />
            <label for="regenerateToken" class="text-sm text-neutral-700 flex-1">
              <div class="font-medium mb-0.5">
                {{ 'ref_tests.detail.reset.regenerate_token_label' | translate }}
              </div>
              <p class="text-xs text-neutral-500">
                {{ 'ref_tests.detail.reset.regenerate_token_description' | translate }}
              </p>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-neutral-200 flex justify-end gap-3">
        <button
          type="button"
          (click)="cancel.emit()"
          class="px-4 py-2 border border-neutral-300 rounded-lg text-sm font-medium text-neutral-700 hover:bg-neutral-50 transition-colors"
          [disabled]="loading()"
        >
          {{ 'common.cancel' | translate }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm font-medium hover:bg-red-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              {{ 'common.processing' | translate }}
            </span>
          } @else {
            {{ 'ref_tests.detail.reset.confirm_button' | translate }}
          }
        </button>
      </div>
    </div>
  </div>
}
