@if (show()) {
  <div
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
    (click)="cancel.emit()"
  >
    <div
      class="bg-white rounded-xl shadow-xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-labelledby="dialog-title"
      aria-modal="true"
    >
      <!-- Header -->
      <div class="px-6 py-4 border-b border-neutral-200">
        <h2 id="dialog-title" class="text-xl font-bold text-neutral-900">
          {{ 'ref_tests.detail.revive.title' | translate }}
        </h2>
        <p class="text-sm text-neutral-600 mt-1">
          {{ 'ref_tests.detail.revive.subtitle' | translate }}
        </p>
      </div>

      <!-- Banner Container -->
      <div class="px-6 pt-4">
        <app-banner [bannerManager]="bannerManager()" />
      </div>

      <!-- Content -->
      <div class="px-6 py-6 overflow-y-auto flex-1 scrollbar-hide">
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
          <div class="flex items-start gap-3">
            <svg
              class="w-6 h-6 text-blue-600 shrink-0 mt-0.5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
            <div>
              <p class="text-sm font-medium text-blue-800">
                {{ 'ref_tests.detail.revive.info_title' | translate }}
              </p>
              <p class="text-sm text-blue-700 mt-1">
                {{ 'ref_tests.detail.revive.info_message' | translate }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-neutral-200 flex justify-end gap-3">
        <button
          type="button"
          (click)="cancel.emit()"
          class="px-4 py-2 border border-neutral-300 rounded-lg text-sm font-medium text-neutral-700 hover:bg-neutral-50 transition-colors"
          [disabled]="loading()"
        >
          {{ 'common.cancel' | translate }}
        </button>
        <button
          type="button"
          (click)="confirm.emit()"
          class="px-4 py-2 bg-primary-600 text-white rounded-lg text-sm font-medium hover:bg-primary-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loading()"
        >
          @if (loading()) {
            <span class="flex items-center gap-2">
              <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
              {{ 'common.processing' | translate }}
            </span>
          } @else {
            {{ 'ref_tests.detail.revive.confirm_button' | translate }}
          }
        </button>
      </div>
    </div>
  </div>
}
