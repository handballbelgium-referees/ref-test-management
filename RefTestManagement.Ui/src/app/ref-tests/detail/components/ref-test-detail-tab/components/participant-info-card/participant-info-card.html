<div class="h-full bg-neutral-50 rounded-lg p-6 border border-neutral-200">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold text-neutral-900 flex items-center gap-2">
      <svg
        class="w-5 h-5 text-primary-600"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
        />
      </svg>
      {{ 'ref_tests.detail.participant_info' | translate }}
    </h2>
    @if (status() !== RefTestStatus.InProgress && status() !== RefTestStatus.Completed) {
      <button
        type="button"
        (click)="edit.emit()"
        class="text-primary-600 hover:text-primary-700 transition-colors p-1"
        [attr.aria-label]="'ref_tests.detail.edit_participant.edit_button' | translate"
        title="{{ 'ref_tests.detail.edit_participant.edit_button' | translate }}"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
          />
        </svg>
      </button>
    }
  </div>
  <dl class="space-y-3">
    <div>
      <dt class="text-sm font-medium text-neutral-500">
        {{ 'ref_tests.detail.name' | translate }}
      </dt>
      <dd class="mt-1 text-sm text-neutral-900">{{ name() || '-' }}</dd>
    </div>
    <div>
      <dt class="text-sm font-medium text-neutral-500">
        {{ 'ref_tests.detail.email' | translate }}
      </dt>
      <dd class="mt-1 text-sm text-neutral-900">{{ email() }}</dd>
    </div>
  </dl>
</div>
