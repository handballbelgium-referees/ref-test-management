<app-pull-to-refresh [isRefreshing]="isRefreshing()" (onRefresh)="refresh()">
  <!-- Hero Section -->
  <app-ref-test-list-hero />

  <!-- Banner Container -->
  <app-banner containerClass="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4" />

  <!-- Main Content with Pull-to-Refresh -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Top Actions Bar -->
    <app-ref-test-list-toolbar
      [visibleColumns]="columnVisibility.visibleColumns()"
      [showColumnMenu]="columnVisibility.showColumnMenu()"
      [searchTerm]="filterState.filter().searchTerm"
      (createClick)="navigateToCreate()"
      (searchInput)="onSearchInput($event)"
      (toggleMenuClick)="toggleColumnMenu()"
      (toggleColumnClick)="toggleColumn($event)"
    />

    <!-- Filters and Sorting -->
    <div class="mb-6">
      <app-ref-test-filters-card
        [filter]="filterState.filter()"
        [statusCounts]="dataService.statusCounts()"
        (statusFilterChange)="setStatusFilter($event)"
        (titleFilterChange)="setTitleFilter($event)"
        (invitationFilterChange)="setInvitationFilter($event)"
        (resultsFilterChange)="setResultsFilter($event)"
        (languageFilterChange)="setLanguageFilter($event)"
        (sortingChange)="setSorting($event.field, $event.direction)"
        (performanceFilterChange)="setPerformanceFilters($event)"
        (dateRangeChange)="setDateRange($event.type, $event.after, $event.before)"
      />
    </div>

    <!-- Actions Bar -->
    <app-ref-test-actions
      [selectedCount]="selectionManager.selectedCount()"
      [hasCompletedRefTestsSelected]="hasCompletedRefTestsSelected()"
      [hasPendingRefTestsSelected]="hasPendingRefTestsSelected()"
      [hasInProgressOrCompletedRefTestsSelected]="hasInProgressOrCompletedRefTestsSelected()"
      [hasExpiredRefTestsSelected]="hasExpiredRefTestsSelected()"
      [hasApprovableRefTestsSelected]="hasApprovableRefTestsSelected()"
      [hasPendingApprovalRefTestsSelected]="hasPendingApprovalRefTestsSelected()"
      [sendingInvitations]="operationManager.sendInvitationsDialog.loading()"
      [sendingResults]="operationManager.sendResultsDialog.loading()"
      [deletingRefTests]="operationManager.deleteDialog.loading()"
      [generatingReport]="operationManager.generateReportDialog.loading()"
      [resettingRefTests]="operationManager.resetDialog.loading()"
      [revivingRefTests]="operationManager.reviveDialog.loading()"
      [approvingRefTests]="operationManager.approveDialog.loading()"
      [rejectingRefTests]="operationManager.rejectDialog.loading()"
      (sendInvitations)="operationManager.sendInvitationsDialog.initiate()"
      (sendResults)="operationManager.sendResultsDialog.initiate()"
      (deleteSelected)="operationManager.deleteDialog.initiate()"
      (generateReport)="operationManager.generateReportDialog.initiate()"
      (resetSelected)="operationManager.resetDialog.initiate()"
      (reviveSelected)="operationManager.reviveDialog.initiate()"
      (approveSelected)="operationManager.approveDialog.initiate()"
      (rejectSelected)="operationManager.rejectDialog.initiate()"
    />

    <!-- Loading State -->
    @if (showMainLoading()) {
      <div class="bg-white rounded-xl shadow-sm border border-neutral-200 p-12 text-center">
        <div
          class="animate-spin rounded-full h-12 w-12 border-b-4 border-primary-600 mx-auto mb-4"
        ></div>
        <p class="text-neutral-600">{{ 'ref_tests.list.loading' | translate }}</p>
      </div>
    }

    <!-- Empty State -->
    @else if (refTests().length === 0) {
      <app-ref-test-empty-state (createClick)="navigateToCreate()" />
    }

    <!-- ref_tests List -->
    @else {
      <!-- Desktop Table View -->
      <app-ref-test-table
        [refTests]="refTests()"
        [visibleColumns]="columnVisibility.visibleColumns()"
        [filter]="filterState.filter()"
        [passingPercentage]="passingPercentage()"
        [allSelected]="allSelected()"
        [someSelected]="someSelected()"
        [selectedIds]="selectionManager.selectedIds()"
        [showCheckboxes]="showCheckboxes()"
        [canNavigate]="canNavigate()"
        (toggleSelectAll)="toggleSelectAll()"
        (toggleSelection)="toggleRefTestSelection($event)"
        (sortColumn)="sortByColumn($event)"
      />

      <!-- Mobile Card View -->
      <app-ref-test-mobile-list
        [refTests]="refTests()"
        [visibleColumns]="columnVisibility.visibleColumns()"
        [passingPercentage]="passingPercentage()"
        [allSelected]="allSelected()"
        [someSelected]="someSelected()"
        [selectedCount]="selectedCount()"
        [selectedIds]="selectionManager.selectedIds()"
        [showCheckboxes]="showCheckboxes()"
        [canNavigate]="canNavigate()"
        (toggleSelectAll)="toggleSelectAll()"
        (toggleSelection)="toggleRefTestSelection($event)"
      />

      <!-- Performance Warning -->
      @if (dataService.showPerformanceWarning()) {
        <app-ref-test-performance-warning />
      }

      <!-- Pagination -->
      <app-ref-test-pagination
        [displayedCount]="refTests().length"
        [totalCount]="totalCount()"
        [canLoadMore]="dataService.canLoadMore()"
        [isAtMaxCapacity]="dataService.isAtMaxCapacity()"
        [loadingMore]="loadingMore()"
        [maxLoadableItems]="REF_TEST_CONFIG.MAX_LOADABLE_ITEMS"
        (loadMore)="loadMore()"
      />
    }
  </div>

  <!-- Send Invitations Dialog -->
  <app-send-invitations-dialog
    [loading]="operationManager.sendInvitationsDialog.loading()"
    [show]="operationManager.sendInvitationsDialog.show()"
    [bannerManager]="operationManager.sendInvitationsDialog.bannerManager()"
    [summary]="invitationSummary()"
    (confirm)="confirmSendInvitations()"
    (cancel)="operationManager.sendInvitationsDialog.cancel()"
  >
  </app-send-invitations-dialog>

  <!-- Send Results Dialog -->
  <app-send-results-dialog
    [loading]="operationManager.sendResultsDialog.loading()"
    [show]="operationManager.sendResultsDialog.show()"
    [bannerManager]="operationManager.sendResultsDialog.bannerManager()"
    [summary]="resultsSummary()"
    (confirm)="confirmSendResults()"
    (cancel)="operationManager.sendResultsDialog.cancel()"
  >
  </app-send-results-dialog>

  <!-- Delete ref_tests Dialog -->
  <app-delete-ref-tests-dialog
    [loading]="operationManager.deleteDialog.loading()"
    [show]="operationManager.deleteDialog.show()"
    [refTests]="refTestsToDelete()"
    [bannerManager]="operationManager.deleteDialog.bannerManager()"
    (confirm)="confirmDelete()"
    (cancel)="operationManager.deleteDialog.cancel()"
  >
  </app-delete-ref-tests-dialog>

  <!-- Generate Report Dialog -->
  <app-generate-report-dialog
    [loading]="operationManager.generateReportDialog.loading()"
    [show]="operationManager.generateReportDialog.show()"
    [summary]="reportSummary()"
    [bannerManager]="operationManager.generateReportDialog.bannerManager()"
    (confirm)="confirmGenerateReport()"
    (cancel)="operationManager.generateReportDialog.cancel()"
  >
  </app-generate-report-dialog>

  <!-- Reset Dialog -->
  <app-reset-ref-tests-dialog
    [loading]="operationManager.resetDialog.loading()"
    [show]="operationManager.resetDialog.show()"
    [refTests]="refTestsToReset()"
    [bannerManager]="operationManager.resetDialog.bannerManager()"
    (confirm)="confirmReset($event)"
    (cancel)="operationManager.resetDialog.cancel()"
  >
  </app-reset-ref-tests-dialog>

  <!-- Revive Dialog -->
  <app-revive-ref-tests-dialog
    [loading]="operationManager.reviveDialog.loading()"
    [show]="operationManager.reviveDialog.show()"
    [refTests]="refTestsToRevive()"
    [bannerManager]="operationManager.reviveDialog.bannerManager()"
    (confirm)="confirmRevive()"
    (cancel)="operationManager.reviveDialog.cancel()"
  >
  </app-revive-ref-tests-dialog>

  <!-- Approve Dialog -->
  <app-approve-ref-tests-dialog
    [loading]="operationManager.approveDialog.loading()"
    [show]="operationManager.approveDialog.show()"
    [refTests]="refTestsToApproveOrReject()"
    [bannerManager]="operationManager.approveDialog.bannerManager()"
    (confirm)="confirmApprove()"
    (cancel)="operationManager.approveDialog.cancel()"
  >
  </app-approve-ref-tests-dialog>

  <!-- Reject Dialog -->
  <app-reject-ref-tests-dialog
    [loading]="operationManager.rejectDialog.loading()"
    [show]="operationManager.rejectDialog.show()"
    [refTests]="refTestsToApproveOrReject()"
    [bannerManager]="operationManager.rejectDialog.bannerManager()"
    (confirm)="confirmReject($event)"
    (cancel)="operationManager.rejectDialog.cancel()"
  >
  </app-reject-ref-tests-dialog>
</app-pull-to-refresh>
