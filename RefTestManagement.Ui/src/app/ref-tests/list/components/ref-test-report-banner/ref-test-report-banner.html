<div
  [class]="
    result().success ? 'bg-success-50 border border-success-200' : 'bg-red-50 border border-red-200'
  "
  class="rounded-lg p-4 mb-6"
  role="alert"
>
  <div class="flex items-start gap-3">
    @if (result().success) {
      <svg
        class="w-5 h-5 text-success-600 shrink-0 mt-0.5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    } @else {
      <svg
        class="w-5 h-5 text-red-600 shrink-0 mt-0.5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    }
    <div class="flex-1 min-w-0">
      <p
        [class]="result().success ? 'text-success-800' : 'text-red-800'"
        class="text-sm font-medium"
      >
        {{
          (result().success ? 'ref_tests.list.report.success' : 'ref_tests.list.report.error')
            | translate
        }}
      </p>
      @if (result().refTestCount > 0) {
        <p [class]="result().success ? 'text-success-700' : 'text-red-700'" class="text-xs mt-1">
          {{ 'ref_tests.list.report.ref_test_count' | translate: { count: result().refTestCount } }}
        </p>
      }
    </div>
    <button
      type="button"
      (click)="dismiss.emit()"
      [class]="
        result().success
          ? 'text-success-600 hover:text-success-800'
          : 'text-red-600 hover:text-red-800'
      "
      class="shrink-0 focus:outline-none focus:ring-2 focus:ring-offset-2 rounded"
      [class.focus:ring-success-500]="result().success"
      [class.focus:ring-red-500]="!result().success"
      [attr.aria-label]="'ref_tests.list.report.dismiss' | translate"
      title="{{ 'ref_tests.list.report.dismiss' | translate }}"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
</div>
