@if (selectedCount() > 0) {
<div class="mb-6 bg-primary-50 border border-primary-200 rounded-lg p-4">
  <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between">
    <div class="text-sm font-medium text-primary-900">
      {{ selectedCount() }}
      {{
        selectedCount() === 1
          ? ('ref_tests.list.bulk.reftests_selected' | translate)
          : ('ref_tests.list.bulk.reftests_selected' | translate)
      }}
    </div>
    <div class="flex gap-2 w-full sm:w-auto flex-wrap">
      <button
        type="button"
        [disabled]="!hasPendingRefTestsSelected() || sendingInvitations() || deletingRefTests()"
        (click)="onSendInvitations($event)"
        class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (sendingInvitations()) {
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white -ml-1 mr-2"></div>
        } @else {
        <svg class="-ml-1 mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
          />
        </svg>
        }
        {{
          selectedCount() === 1
            ? ('ref_tests.list.actions.send_invitation' | translate)
            : ('ref_tests.list.bulk.send_invitations' | translate)
        }}
      </button>
      <button
        type="button"
        [disabled]="!hasCompletedRefTestsSelected() || sendingResults() || deletingRefTests()"
        (click)="onSendResults($event)"
        class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (sendingResults()) {
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white -ml-1 mr-2"></div>
        } @else {
        <svg class="-ml-1 mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        }
        {{
          selectedCount() === 1
            ? ('ref_tests.list.actions.send_results' | translate)
            : ('ref_tests.list.bulk.send_results' | translate)
        }}
      </button>
      @if (selectedCount() > 1) {
      <button
        type="button"
        [disabled]="generatingReport()"
        (click)="onGenerateReport($event)"
        class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-success-600 hover:bg-success-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-success-500 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (generatingReport()) {
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white -ml-1 mr-2"></div>
        } @else {
        <svg class="-ml-1 mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
          />
        </svg>
        }
        {{ 'ref_tests.list.bulk.generate_report' | translate }}
      </button>
      }
      <button
        type="button"
        [disabled]="deletingRefTests()"
        (click)="onDeleteSelected($event)"
        class="flex-1 sm:flex-none inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        @if (deletingRefTests()) {
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white -ml-1 mr-2"></div>
        } @else {
        <svg class="-ml-1 mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
        }
        {{ 'ref_tests.list.bulk.delete' | translate }}
      </button>
    </div>
  </div>
</div>
}
