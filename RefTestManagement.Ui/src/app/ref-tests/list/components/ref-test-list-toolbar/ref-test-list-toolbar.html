<div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
  <button
    type="button"
    (click)="createClick.emit()"
    class="w-full sm:w-auto px-6 py-3 bg-primary-600 text-white rounded-lg hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors font-medium"
  >
    {{ 'ref_tests.list.create_new' | translate }}
  </button>

  <!-- Search Bar and Column Toggle -->
  <div class="flex gap-2 w-full sm:w-auto">
    <!-- Column Visibility Menu -->
    <app-column-visibility-menu
      [visibleColumns]="visibleColumns()"
      [showMenu]="showColumnMenu()"
      (toggleMenu)="toggleMenuClick.emit()"
      (toggleColumn)="toggleColumnClick.emit($event)"
    />

    <!-- Search Bar -->
    <div class="flex-1 sm:w-96">
      <input
        type="search"
        [placeholder]="'ref_tests.list.search_placeholder' | translate"
        [attr.aria-label]="'ref_tests.list.search_placeholder' | translate"
        (input)="searchInput.emit($event)"
        class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent"
      />
    </div>
  </div>
</div>
