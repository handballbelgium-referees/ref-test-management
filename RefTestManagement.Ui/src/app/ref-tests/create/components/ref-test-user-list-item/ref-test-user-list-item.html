<div
  class="flex gap-2 items-start p-3 bg-neutral-50 rounded-lg border border-neutral-200 hover:border-primary-200 hover:bg-primary-50/30 transition-all group"
>
  <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-2">
    <div>
      <label
        [for]="'firstName-' + index()"
        class="block text-xs font-medium text-neutral-700 mb-1"
      >
        {{ 'ref_tests.create.form.users.first_name' | translate }} *
      </label>
      <input
        [id]="'firstName-' + index()"
        type="text"
        [value]="participant().firstName"
        (input)="onFieldChange('firstName', $any($event.target).value)"
        [title]="'ref_tests.create.form.users.first_name' | translate"
        [attr.aria-label]="'ref_tests.create.form.users.first_name' | translate"
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white"
        placeholder="{{ 'ref_tests.create.form.users.first_name_placeholder' | translate }}"
      />
    </div>

    <div>
      <label
        [for]="'lastName-' + index()"
        class="block text-xs font-medium text-neutral-700 mb-1"
      >
        {{ 'ref_tests.create.form.users.last_name' | translate }} *
      </label>
      <input
        [id]="'lastName-' + index()"
        type="text"
        [value]="participant().lastName"
        (input)="onFieldChange('lastName', $any($event.target).value)"
        [title]="'ref_tests.create.form.users.last_name' | translate"
        [attr.aria-label]="'ref_tests.create.form.users.last_name' | translate"
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white"
        placeholder="{{ 'ref_tests.create.form.users.last_name_placeholder' | translate }}"
      />
    </div>

    <div>
      <label [for]="'email-' + index()" class="block text-xs font-medium text-neutral-700 mb-1">
        {{ 'ref_tests.create.form.users.email' | translate }} *
      </label>
      <input
        [id]="'email-' + index()"
        type="email"
        [value]="participant().email"
        (input)="onFieldChange('email', $any($event.target).value)"
        [title]="'ref_tests.create.form.users.email' | translate"
        [attr.aria-label]="'ref_tests.create.form.users.email' | translate"
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white"
        placeholder="{{ 'ref_tests.create.form.users.email_placeholder' | translate }}"
      />
    </div>

    <div>
      <label [for]="'type-' + index()" class="block text-xs font-medium text-neutral-700 mb-1">
        {{ 'ref_tests.create.form.users.type' | translate }} *
      </label>
      <select
        [id]="'type-' + index()"
        [value]="participant().type"
        (change)="onFieldChange('type', $any($event.target).value)"
        [title]="'ref_tests.create.form.users.type' | translate"
        [attr.aria-label]="'ref_tests.create.form.users.type' | translate"
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white"
      >
        @for (option of typeOptions; track option.value) {
          <option [value]="option.value">{{ option.labelKey | translate }}</option>
        }
      </select>
    </div>

    <div>
      <label [for]="'level-' + index()" class="block text-xs font-medium text-neutral-700 mb-1">
        {{ 'ref_tests.create.form.users.level' | translate }}
      </label>
      <select
        [id]="'level-' + index()"
        [value]="participant().level ?? ''"
        (change)="onFieldChange('level', $any($event.target).value || null)"
        [disabled]="participant().type !== 'REFEREE'"
        [title]="'ref_tests.create.form.users.level' | translate"
        [attr.aria-label]="'ref_tests.create.form.users.level' | translate"
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white disabled:bg-neutral-100 disabled:text-neutral-500"
      >
        <option value="">{{ 'ref_tests.create.form.users.level_optional' | translate }}</option>
        @for (option of levelOptions; track option.value) {
          <option [value]="option.value">{{ option.labelKey | translate }}</option>
        }
      </select>
    </div>
  </div>

  @if (showRemove()) {
    <button
      type="button"
      title="{{ 'ref_tests.create.form.users.remove_participant' | translate }}"
      (click)="remove.emit()"
      class="mt-6 p-1.5 text-neutral-400 focus:text-red-600 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100 focus:opacity-100"
      [attr.aria-label]="
        ('ref_tests.create.form.users.remove_participant' | translate) + ' ' + (index() + 1)
      "
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        />
      </svg>
    </button>
  }
</div>
