@if (show()) {
  <div class="mb-4 p-4 bg-secondary-50 rounded-xl border border-secondary-200">
    <div class="mb-3">
      <label for="questionText" class="block text-sm font-semibold text-neutral-900 mb-2">
        {{ 'ref_tests.create.form.specific_question_numbers.import_label' | translate }}
      </label>
      <textarea
        id="questionText"
        [value]="text()"
        [disabled]="loading()"
        (input)="text.set($any($event.target).value)"
        rows="6"
        [title]="'ref_tests.create.form.specific_question_numbers.import_label' | translate"
        [attr.aria-label]="
          'ref_tests.create.form.specific_question_numbers.import_label' | translate
        "
        class="w-full px-3 py-2 border border-neutral-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 font-mono text-sm bg-white disabled:opacity-50 disabled:cursor-not-allowed"
        placeholder="1, 5, 12&#10;20, 35&#10;101"
      ></textarea>
      <p class="mt-2 text-xs text-neutral-600">
        {{ 'ref_tests.create.form.specific_question_numbers.import_hint' | translate }}
      </p>
    </div>
    <div class="flex gap-2">
      <button
        type="button"
        [disabled]="loading()"
        (click)="onImport()"
        class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700 font-medium text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
      >
        @if (loading()) {
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
        }
        {{ 'ref_tests.create.form.specific_question_numbers.import_button' | translate }}
      </button>
      <button
        type="button"
        [disabled]="loading()"
        (click)="onCancel()"
        class="px-4 py-2 bg-white border border-neutral-300 text-neutral-700 rounded-lg hover:bg-neutral-50 font-medium text-sm transition-colors"
      >
        {{ 'ref_tests.create.form.cancel' | translate }}
      </button>
    </div>
  </div>
}
