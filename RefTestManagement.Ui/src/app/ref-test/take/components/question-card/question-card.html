<div class="bg-white rounded-xl border border-neutral-200 shadow-sm p-6 md:p-8 mb-6">
  <div class="mb-6">
    <div class="text-sm text-neutral-500 mb-2">
      {{ 'ref_test.question' | translate }} {{ currentIndex() + 1 }} / {{ totalQuestions() }}
    </div>
    <h2 class="text-xl md:text-2xl font-bold text-neutral-900 wrap-break-word">
      {{ question().phrase | appTranslation : currentLanguage() }}
    </h2>
  </div>

  <!-- Answers -->
  <div class="space-y-3">
    @for (answer of question().answers; track answer.id) {
    <app-answer-option
      [phrase]="answer.phrase"
      [selected]="isAnswerSelected(answer.id)"
      [currentLanguage]="currentLanguage()"
      (answerClick)="answerSelected.emit(answer.id)"
    />
    }
  </div>
</div>
