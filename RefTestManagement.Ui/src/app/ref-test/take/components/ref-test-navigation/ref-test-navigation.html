<div class="space-y-3">
  <!-- Question progress and navigation -->
  <div class="flex flex-wrap items-center justify-center gap-2">
    <span class="text-sm text-neutral-600 whitespace-nowrap">
      {{ 'ref_test.question' | translate }}
    </span>
    <select
      [value]="currentQuestionIndex()"
      (change)="questionSelected.emit(+$any($event.target).value)"
      class="px-2 py-1 border border-neutral-300 rounded text-sm font-medium focus:outline-none focus:ring-2 focus:ring-primary-500"
    >
      @for (question of questions(); track question.id; let i = $index) {
      <option [value]="i" [disabled]="!isQuestionVisited()(i)" [selected]="i === currentQuestionIndex()">
        {{ i + 1 }} @if (isQuestionAnswered()(question.id)) { ✓ }
      </option>
      }
    </select>
    <span class="text-sm text-neutral-600 whitespace-nowrap">
      {{ 'ref_test.of' | translate }} {{ questions().length }}
    </span>
    <span class="text-sm text-green-600 font-medium">
      ({{ answeredCount() }} {{ 'ref_test.answered' | translate }})
    </span>
  </div>

  <!-- Previous/Next buttons -->
  <div class="flex items-center justify-between gap-3">
    <button
      type="button"
      (click)="previousClick.emit()"
      [disabled]="!canPrevious()"
      class="flex-1 sm:flex-none px-4 sm:px-6 py-3 border-2 border-neutral-300 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:bg-neutral-50"
    >
      {{ 'ref_test.previous' | translate }}
    </button>

    @if (isLastQuestion()) {
    <button
      type="button"
      (click)="submitClick.emit()"
      class="flex-1 sm:flex-none px-4 sm:px-6 py-3 bg-primary-600 text-white rounded-lg font-semibold transition-colors hover:bg-primary-700"
    >
      {{ 'ref_test.submit' | translate }}
    </button>
    } @else {
    <button
      type="button"
      (click)="nextClick.emit()"
      [disabled]="!canNext()"
      class="flex-1 sm:flex-none px-4 sm:px-6 py-3 bg-primary-600 text-white rounded-lg font-semibold transition-colors hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ 'ref_test.next' | translate }}
    </button>
    }
  </div>
</div>
