<div
  class="relative rounded-2xl bg-linear-to-br from-white to-neutral-50 border border-neutral-200 shadow-sm overflow-hidden"
>
  <!-- Decorative background element -->
  <div
    class="absolute top-0 right-0 w-64 h-64 bg-red-50 rounded-full blur-3xl opacity-30 -translate-y-1/2 translate-x-1/2"
  ></div>

  <div class="relative p-8 md:p-12">
    <!-- Icon -->
    <div class="mb-6 flex justify-center">
      <div class="relative">
        <div
          class="absolute inset-0 bg-red-400 rounded-full blur-lg opacity-20 animate-pulse"
        ></div>
        <div
          class="relative flex h-20 w-20 items-center justify-center rounded-full bg-linear-to-br from-red-50 to-red-100 border border-red-200"
        >
          <svg class="h-10 w-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="text-center space-y-4">
      <h2
        class="text-2xl md:text-3xl font-bold bg-linear-to-r from-neutral-900 to-neutral-700 bg-clip-text text-transparent"
      >
        {{ 'ref_test.error.title' | translate }}
      </h2>
      <p class="text-neutral-600 text-base md:text-lg leading-relaxed">
        {{ 'ref_test.error.' + errorType() | translate }}
      </p>
    </div>
  </div>
</div>
