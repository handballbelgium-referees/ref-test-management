<!-- Hero Section -->
@if (!error() && refTest() && !loading()) {
  <app-ref-test-hero />
}

<!-- Main Content -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  @if (loading()) {
    <div class="flex flex-col items-center justify-center py-20" role="status" aria-live="polite">
      <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-primary-600"></div>
      <p class="mt-4 text-lg font-semibold text-neutral-700">
        {{ 'ref_test.loading' | translate }}
      </p>
    </div>
  } @else if (error()) {
    <app-ref-test-error [errorType]="error()!" />
  } @else if (refTest(); as refTest) {
    <div class="rounded-lg border border-neutral-200 bg-white p-6 shadow-sm">
      <!-- RefTest Details -->
      <app-ref-test-details [refTest]="refTest" />
      <!-- Instructions -->
      <app-ref-test-instructions [hasTimeLimit]="!!refTest.maxTimeInMinutes" />
      <label
        class="mt-6 flex items-start gap-3 rounded-lg border border-neutral-200 bg-neutral-50 p-4 text-sm text-neutral-700"
      >
        <input
          type="checkbox"
          class="mt-1 h-4 w-4 shrink-0 accent-primary-600"
          [checked]="privacyAccepted()"
          (change)="privacyAccepted.set($any($event.target).checked)"
        />
        <span>
          {{ 'ref_test.privacy_consent' | translate }}
          <a
            href="/privacy"
            target="_blank"
            rel="noopener noreferrer"
            class="font-semibold text-primary-700 underline underline-offset-2"
          >
            {{ 'footer.privacy' | translate }} </a
          >.
        </span>
      </label>
      @if (privacyNoticeError()) {
        <p class="mt-3 text-sm text-red-700" role="alert">
          {{ 'ref_test.privacy_consent_error' | translate }}
        </p>
      }
      <!-- Start Button -->
      <button
        type="button"
        (click)="startRefTest()"
        [disabled]="!canStart() || !privacyAccepted() || acceptingPrivacyNotice()"
        class="w-full rounded-lg bg-primary-600 hover:bg-primary-700 px-6 py-4 text-lg font-semibold text-white transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ 'ref_test.start_button' | translate }}
      </button>
    </div>
  }
</div>
