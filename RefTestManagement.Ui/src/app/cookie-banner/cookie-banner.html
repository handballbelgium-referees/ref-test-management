@if (visible()) {
  <div
    role="region"
    [attr.aria-label]="'cookieBanner.label' | translate"
    class="fixed inset-x-0 bottom-0 z-50 border-t border-neutral-200 bg-white shadow-lg pb-[env(safe-area-inset-bottom)]"
  >
    <div
      class="mx-auto flex w-full max-w-7xl min-w-0 flex-col gap-3 px-4 py-4 sm:flex-row sm:items-center sm:justify-between"
    >
      <p class="min-w-0 wrap-break-word text-sm text-neutral-800">
        {{ 'cookieBanner.message' | translate }}
        <a
          routerLink="/cookies"
          class="rounded-sm text-primary-700 underline decoration-2 underline-offset-2 hover:text-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-600 focus:ring-offset-2"
        >
          {{ 'cookieBanner.learnMore' | translate }}
        </a>
      </p>
      <button
        type="button"
        (click)="accept()"
        class="min-h-11 shrink-0 rounded-md bg-primary-700 px-4 py-2 text-sm font-semibold text-white hover:bg-primary-800 focus:outline-none focus:ring-2 focus:ring-primary-600 focus:ring-offset-2"
      >
        {{ 'cookieBanner.accept' | translate }}
      </button>
    </div>
  </div>
}
