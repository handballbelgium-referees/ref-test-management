@for (change of parsedChanges(); track change.property) {
  <span class="font-medium text-neutral-500 whitespace-nowrap py-0.5">
    {{ formatLabel(change.property) }}
  </span>
  <span class="min-w-0 py-0.5">
    @if (isOldNew(change.value)) {
      <span class="flex flex-col gap-0.5">
        <span class="line-through text-red-400 wrap-break-word">{{
          formatValue($any(change.value).old)
        }}</span>
        <span class="text-green-600 wrap-break-word">{{
          formatValue($any(change.value).new)
        }}</span>
      </span>
    } @else {
      <span class="text-neutral-800 wrap-break-word">{{ formatValue(change.value) }}</span>
    }
  </span>
}
