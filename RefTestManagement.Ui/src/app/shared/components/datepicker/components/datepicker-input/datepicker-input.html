<input
  #input
  type="text"
  [value]="value()"
  [readonly]="readonly()"
  [placeholder]="placeholder()"
  (focus)="focus.emit()"
  (input)="onInput($event)"
  (blur)="onBlur($event)"
  (keydown)="onKeydown($event)"
  class="datepicker-input w-full py-2 pr-10 pl-3 border border-neutral-200 rounded-lg text-sm text-neutral-900 bg-white cursor-pointer hover:border-neutral-400 focus:outline-2 focus:outline-primary-600 focus:outline-offset-2 focus:border-primary-600"
/>
