<div #grid role="grid" class="grid gap-1" [attr.aria-label]="gridLabel()">
  <div role="row" class="grid grid-cols-7 col-span-7 gap-1">
    @for (day of weekDays(); track day; let i = $index) {
      <div
        role="columnheader"
        class="text-neutral-600 font-semibold uppercase tracking-wider text-center text-[0.65rem] py-1.5 md:text-xs md:py-2"
        [attr.aria-label]="fullWeekDays()[i]"
        [title]="fullWeekDays()[i]"
      >
        {{ day }}
      </div>
    }
  </div>
  @for (week of calendarWeeks(); track $index) {
    <div role="row" class="grid grid-cols-7 col-span-7 gap-1">
      @for (day of week; track day.date.getTime()) {
        <div
          role="gridcell"
          [attr.aria-selected]="day.isSelected"
          [attr.aria-current]="day.isToday ? 'date' : null"
        >
          <button
            type="button"
            class="text-neutral-900 rounded-lg transition-all font-medium w-full border border-transparent bg-transparent cursor-pointer flex items-center justify-center text-xs h-8 md:text-sm md:h-10 focus-visible:outline-2 focus-visible:outline-primary-600 focus-visible:outline-offset-2"
            [class.!text-neutral-400]="!day.isCurrentMonth"
            [class.border-2]="day.isToday && !day.isSelected"
            [class.!border-primary-600]="day.isToday && !day.isSelected"
            [class.!bg-white]="day.isToday && !day.isSelected"
            [class.!text-primary-600]="day.isToday && !day.isSelected"
            [class.font-semibold]="day.isToday || day.isSelected"
            [class.!bg-primary-600]="day.isSelected"
            [class.!text-white]="day.isSelected"
            [class.!text-neutral-300]="day.isDisabled"
            [class.!cursor-not-allowed]="day.isDisabled"
            [class.opacity-50]="day.isDisabled"
            [class.hover:bg-neutral-100]="!day.isDisabled && !day.isSelected"
            [class.hover:border-neutral-300]="!day.isDisabled && !day.isSelected"
            [class.hover:text-primary-600]="!day.isDisabled && !day.isSelected"
            [disabled]="day.isDisabled"
            [attr.aria-label]="dateLabel(day)"
            [attr.data-calendar-day]="true"
            [attr.tabindex]="isActive(day) ? 0 : -1"
            (click)="selectDay(day)"
            (keydown)="onKeydown($event, day)"
          >
            {{ day.day }}
          </button>
        </div>
      }
    </div>
  }
</div>
