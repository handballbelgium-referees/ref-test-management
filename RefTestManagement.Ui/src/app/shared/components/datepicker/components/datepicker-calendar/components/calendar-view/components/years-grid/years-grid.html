<div class="grid grid-cols-3 gap-2">
  @for (yearItem of years(); track yearItem.year) {
  <button
    type="button"
    class="text-neutral-900 rounded-lg transition-all font-medium w-full border border-transparent bg-transparent cursor-pointer flex items-center justify-center hover:bg-neutral-100 hover:border-neutral-300 hover:text-primary-600 text-xs h-8 md:text-sm md:h-10 focus-visible:outline-2 focus-visible:outline-primary-600 focus-visible:outline-offset-2"
    [class.!bg-primary-600]="yearItem.isSelected"
    [class.!text-white]="yearItem.isSelected"
    [class.font-semibold]="yearItem.isSelected"
    [class.text-neutral-400]="yearItem.isOutOfRange"
    [attr.aria-pressed]="yearItem.isSelected"
    (click)="selectYear(yearItem.year)"
  >
    {{ yearItem.year }}
  </button>
  }
</div>
